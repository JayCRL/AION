<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AION OS</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
:root{--bg:#050508;--bg2:#0c0c14;--bg3:#12121e;--glass:rgba(255,255,255,.04);--glass-brd:rgba(255,255,255,.07);--txt:#eaeaf0;--txt2:#6b6b80;--acc:#7c6ee4;--acc-glow:rgba(124,110,228,.35);--ok:#34d399;--err:#f87171;--warn:#fbbf24;--r:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
::selection{background:var(--acc);color:#fff}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* ── ambient background:武科大实景底图(静态)── */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  background:#050508 url('/bg-wust.jpg') center/cover no-repeat}
/* 上透下深的压暗罩,保证 logo / 输入框 / 聊天消息在任何画面下可读 */
.stars::before{content:'';position:absolute;inset:0;background:
  linear-gradient(180deg, rgba(5,5,10,.40) 0%, rgba(5,5,10,.60) 52%, rgba(5,5,10,.85) 100%)}
body.lite .logo-img,body.lite .logo-ring{animation:none}
body.lite .logo-text,body.lite .logo-tag,body.lite .logo-sub,body.lite .os-clock{opacity:1;animation:none}
body.lite *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
body.lite .input-box{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.16)}

/* ── logo ── */
.logo-wrap{position:fixed;z-index:10;display:flex;flex-direction:column;align-items:center;gap:16px;transition:all .8s cubic-bezier(.4,0,.2,1)}
.logo-img{filter:drop-shadow(0 0 40px var(--acc-glow));animation:logoFloat 5s ease-in-out infinite}
.logo-ring{position:absolute;top:-12px;left:-12px;right:-12px;bottom:-12px;border:1.5px solid transparent;border-top-color:var(--acc);border-radius:50%;animation:ringSpin 4s linear infinite;pointer-events:none}
.logo-ring::before{content:'';position:absolute;top:-4px;left:50%;width:5px;height:5px;background:var(--acc);border-radius:50%;box-shadow:0 0 12px var(--acc)}
.logo-text{font-size:28px;font-weight:700;letter-spacing:6px;background:linear-gradient(135deg,var(--acc),#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:0;animation:fadeIn 1s .5s forwards}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes ringSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes fadeIn{to{opacity:1}}
.logo-tag{font-size:15px;font-weight:500;letter-spacing:7px;background:linear-gradient(90deg,var(--acc),#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:0;animation:fadeIn 1s 1.1s forwards}
.logo-sub{font-size:12.5px;color:var(--txt2);letter-spacing:.5px;opacity:0;animation:fadeIn 1s 1.5s forwards}
.state-chat .logo-tag,.state-chat .logo-sub{display:none}

/* 左上角时钟:让欢迎/桌面态有系统感。聊天态给品牌标让出左位(见 state-chat .logo-wrap left)。 */
.os-clock{position:fixed;top:14px;left:22px;z-index:40;line-height:1.15;pointer-events:none;opacity:0;animation:fadeIn 1s 1.7s forwards}
.os-clock .clk-t{font-size:24px;font-weight:600;letter-spacing:1.5px;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 18px var(--acc-glow)}
.os-clock .clk-d{font-size:11px;color:var(--txt2);letter-spacing:2px;margin-top:2px}
.state-chat .os-clock{animation:none;opacity:1}

/* ── input ── */
.input-shell{position:fixed;z-index:10;transition:all .8s cubic-bezier(.4,0,.2,1)}
.input-box{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-brd);border-radius:24px;padding:14px 20px;transition:border-color .3s,box-shadow .3s}
.input-box:focus-within{border-color:var(--acc);box-shadow:0 0 30px var(--acc-glow)}
.input-box input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:16px;font-family:inherit}
.input-box input::placeholder{color:var(--txt2)}
.send-ico{width:36px;height:36px;border-radius:50%;background:var(--acc);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.send-ico:hover{transform:scale(1.1)}
.send-ico svg{width:16px;height:16px;fill:#fff}

/* ── landing state ── */
.state-landing .logo-wrap{top:32%;left:50%;transform:translate(-50%,-50%)}
.state-landing .logo-img{width:140px;height:140px}
.state-landing .input-shell{top:58%;left:50%;transform:translate(-50%,-50%);width:min(520px,92vw)}
.state-landing #chatArea{opacity:0;pointer-events:none}
.state-landing .gear-btn{position:fixed;bottom:24px;left:24px;z-index:20}

/* ── chat state ── */
.state-chat .logo-wrap{top:16px;left:126px;transform:none;flex-direction:row;gap:10px}
.state-chat .logo-img{width:32px;height:32px;animation:none}
.state-chat .logo-ring{display:none}
.state-chat .logo-text{font-size:16px;letter-spacing:3px;margin-top:0;opacity:1;animation:none}
.state-chat .input-shell{bottom:20px;left:50%;transform:translateX(-50%);width:min(720px,90vw)}
.state-chat #chatArea{opacity:1;pointer-events:auto;transition:opacity .6s .3s}

/* ── chat area ── */
#chatArea{position:fixed;inset:0;top:60px;bottom:90px;left:0;right:0;z-index:5;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;pointer-events:none}
#chatArea>*{pointer-events:auto}
#chatArea::-webkit-scrollbar{width:3px}
#chatArea::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.msg{max-width:760px;width:100%;margin:0 auto}
.msg.user{align-self:flex-end}
.bubble{padding:12px 16px;border-radius:var(--r);font-size:14px;line-height:1.7;word-break:break-word}
.msg.user .bubble{background:rgba(124,110,228,.15);border:1px solid rgba(124,110,228,.2)}
.msg.assistant .bubble{background:var(--bg2);border:1px solid var(--glass-brd)}
.bubble pre{background:#0a0a0a;padding:10px;border-radius:8px;overflow-x:auto;font-size:13px;margin:8px 0;font-family:monospace}
.bubble code{font-family:monospace;font-size:13px}

/* ── blocks ── */
.blk-term{background:#050505;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 14px;font-family:monospace;font-size:13px;margin:8px 0;overflow-x:auto;white-space:pre-wrap;color:#c9d1d9}
.blk-term .pr{color:var(--ok)}
.blk-term .term-cmd{color:#8b949e;margin-bottom:4px}
.blk-term .term-out{white-space:pre-wrap;word-break:break-word;margin:0}
.blk-term .term-tag{margin-top:4px;font-size:11px;color:#8b949e}
.msg.typing-holder{padding:2px 6px}
.blk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}
.stat{background:var(--bg2);border:1px solid var(--glass-brd);border-radius:10px;padding:12px;text-align:center}
.stat-v{font-size:20px;font-weight:600;color:var(--acc)}
.stat-l{font-size:10px;color:var(--txt2);margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.blk-tbl{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.blk-tbl th{background:var(--bg3);padding:8px 10px;text-align:left;border-bottom:1px solid var(--glass-brd)}
.blk-tbl td{padding:8px 10px;border-bottom:1px solid var(--glass-brd)}
.blk-cfm{background:var(--bg2);border:1px solid var(--warn);border-radius:var(--r);padding:14px;margin:8px 0}
.blk-cfm .t{font-weight:600;color:var(--warn);margin-bottom:8px;font-size:14px}
.blk-cfm .cfm-desc{margin:10px 0;white-space:pre-wrap;word-break:break-word}
.blk-cfm .cfm-cons{color:var(--err);font-size:12.5px;line-height:1.7;padding-left:2px}
.blk-cfm .btns{display:flex;gap:8px;margin-top:14px}
.blk-cfm button[disabled]{opacity:.5;cursor:default}
.btn{padding:7px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:opacity .2s}
.btn:hover{opacity:.8}
.btn-p{background:var(--acc);color:#fff}
.btn-d{background:var(--err);color:#fff}
.btn-g{background:var(--bg3);color:var(--txt2);border:1px solid var(--glass-brd)}

/* 已用外部阅读器打开的被动横幅（无按钮、非警告色） */
.blk-launch{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--glass-brd);border-left:3px solid var(--acc);border-radius:var(--r);padding:12px 14px;margin:8px 0}
.blk-launch .l-icon{font-size:20px;line-height:1}
.blk-launch .l-title{font-size:13.5px;color:var(--txt);font-weight:500}
.blk-launch .l-title b{color:var(--acc)}
.blk-launch .l-path{font-size:11.5px;color:var(--txt2);margin-top:2px;font-family:ui-monospace,Menlo,monospace;word-break:break-all}

/* ── rich blocks: chart / image / file / markdown / stats ── */
.blk-cap{font-size:11px;color:var(--txt2);margin:4px 2px 10px}
.blk-chart{background:var(--bg2);border:1px solid var(--glass-brd);border-radius:12px;padding:14px 16px;margin:8px 0}
.blk-chart .ct{font-size:14px;font-weight:600;margin-bottom:4px}
.blk-chart .cl{font-size:11px;color:var(--txt2);margin:0 0 10px;display:flex;gap:14px;flex-wrap:wrap}
.blk-chart .cl span{display:inline-flex;align-items:center;gap:6px}
.blk-chart .cl i{width:9px;height:9px;border-radius:2px;display:inline-block}
.blk-chart svg{width:100%;height:auto;display:block}
.blk-chart .gl{stroke:rgba(255,255,255,.06)}
.blk-chart .ax{fill:var(--txt2);font-size:10px}
/* 网页感卡片：AION 自己把抓到的页面结构画成站点样式（非真实网页视口） */
.blk-wp{background:var(--bg2);border:1px solid var(--glass-brd);border-radius:14px;overflow:hidden;margin:8px 0}
.blk-wp .top{display:flex;align-items:center;gap:8px 14px;padding:9px 16px;border-bottom:1px solid var(--glass-brd);flex-wrap:wrap;font-size:12px}
.blk-wp .top .nav{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.blk-wp .top .nav a{color:var(--txt2);text-decoration:none;padding:0 9px;white-space:nowrap}
.blk-wp .top .nav a:hover{color:var(--fg);text-decoration:underline}
.blk-wp .top .nav i.sp{width:1px;height:11px;background:var(--glass-brd);flex:none}
.blk-wp .top .brd{margin-left:auto;font-size:13px;font-weight:700;letter-spacing:.3px}
.blk-wp .hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 18px 10px;text-align:center}
.blk-wp .hero .lg{max-height:62px;max-width:min(240px,80%);object-fit:contain}
.blk-wp .hero .nm{font-size:27px;font-weight:700;letter-spacing:.5px}
.blk-wp .hero .tg{font-size:12px;color:var(--txt2);max-width:600px;line-height:1.6}
.blk-wp .srch{display:flex;justify-content:center;padding:12px 18px 20px}
.blk-wp .srch .in{width:min(520px,100%);display:flex;align-items:center;background:var(--bg1);border:1px solid var(--glass-brd);border-radius:999px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.16)}
.blk-wp .srch .q{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:10px 16px;font-size:13px;color:var(--fg)}
.blk-wp .srch .q::placeholder{color:var(--txt2)}
.blk-wp .srch .go{border:0;color:#fff;padding:10px 22px;font-size:13px;font-weight:600;cursor:default;flex:none}
.blk-wp .foot{display:flex;align-items:center;gap:6px 10px;padding:8px 16px;border-top:1px solid var(--glass-brd);font-size:11px;color:var(--txt2);flex-wrap:wrap}
.blk-wp .foot .fl{display:flex;align-items:center;flex-wrap:wrap}
.blk-wp .foot .fl a{color:var(--txt2);text-decoration:none;padding:0 8px;white-space:nowrap}
.blk-wp .foot .fl a:hover{text-decoration:underline}
.blk-wp .foot .fl i.sp{width:1px;height:10px;background:var(--glass-brd);flex:none}
.blk-wp .foot .mt{margin-left:auto;font-family:monospace}
/* —— 正文结构卡片（page 块，Moli DOM 结构 → 原生排版）—— */
.blk-pg{background:var(--bg2);border:1px solid var(--glass-brd);border-radius:14px;overflow:hidden;margin:8px 0}
.blk-pg .top{display:flex;align-items:center;gap:8px 14px;padding:9px 16px;border-bottom:1px solid var(--glass-brd);flex-wrap:wrap;font-size:12px}
.blk-pg .top .nav{display:flex;align-items:center;gap:0;flex-wrap:wrap;min-width:0}
.blk-pg .top .nav a{color:var(--txt2);text-decoration:none;padding:0 9px;white-space:nowrap}
.blk-pg .top .nav a:hover{color:var(--fg);text-decoration:underline}
.blk-pg .top .nav i.sp{width:1px;height:11px;background:var(--glass-brd);flex:none}
.blk-pg .pg-fav{width:20px;height:20px;border-radius:6px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.blk-pg .pg-meta{margin-left:auto;font-family:monospace;color:var(--txt2);font-size:11px}
.blk-pg .pg-head{padding:14px 18px 6px}
.blk-pg .pg-tt{font-size:21px;font-weight:700;letter-spacing:.2px;line-height:1.3}
.blk-pg .pg-url{font-size:12px;color:var(--txt2);text-decoration:none}
.blk-pg .pg-url:hover{text-decoration:underline;color:var(--ac,#1E6FFF)}
.blk-pg .pg-body{padding:6px 18px 14px;max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.blk-pg .pg-body::-webkit-scrollbar{width:6px}
.blk-pg .pg-body::-webkit-scrollbar-thumb{background:var(--glass-brd);border-radius:3px}
.blk-pg .pg-h1{font-size:26px;font-weight:700;margin:6px 0 2px;line-height:1.35}
.blk-pg .pg-h2{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;margin:12px 0 2px;line-height:1.4}
.blk-pg .pg-h2>span{width:4px;height:16px;border-radius:2px;flex:none}
.blk-pg .pg-h3{font-size:15px;font-weight:600;margin:10px 0 0;color:var(--fg);line-height:1.4}
.blk-pg .pg-p{margin:2px 0;font-size:14px;line-height:1.75;color:var(--txt1);white-space:pre-wrap;word-break:break-word}
.blk-pg .pg-li{margin:2px 0;padding-left:22px;display:flex;flex-direction:column;gap:3px}
.blk-pg .pg-li li{font-size:14px;line-height:1.6;color:var(--txt1)}
.blk-pg .pg-q{margin:4px 0;padding:8px 14px;border-left:3px solid var(--ac,#1E6FFF);background:var(--glass);border-radius:0 8px 8px 0;font-size:14px;line-height:1.7;color:var(--txt2);font-style:italic}
.blk-pg .pg-img{display:flex;justify-content:center;margin:6px 0}
.blk-pg .pg-img img{max-width:100%;max-height:320px;border-radius:10px;object-fit:contain;border:1px solid var(--glass-brd)}
.blk-img{margin:8px 0}
.blk-img img{max-width:100%;max-height:420px;object-fit:contain;border-radius:12px;border:1px solid var(--glass-brd);display:block;background:#000}
.blk-img .cap{font-size:11px;color:var(--txt2);margin-top:6px;text-align:center}
.blk-file{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--glass-brd);border-radius:12px;padding:12px 16px;margin:8px 0}
.blk-file .ico{font-size:22px;flex:none}
.blk-file .mid{flex:1;min-width:0}
.blk-file .path{font-family:monospace;font-size:13px;color:var(--txt);word-break:break-all}
.blk-file .meta{font-size:11px;color:var(--txt2);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.blk-file .badge{font-size:10px;padding:2px 8px;border-radius:5px;background:rgba(124,110,228,.16);color:var(--acc);font-family:monospace;flex:none}
.blk-md{background:var(--bg2);border:1px solid var(--glass-brd);border-radius:12px;padding:16px 20px;margin:8px 0;font-size:14px;line-height:1.8;word-break:break-word}
.blk-md h1,.blk-md h2,.blk-md h3,.blk-md h4{color:#fff;margin:12px 0 6px;line-height:1.35}
.blk-md h1{font-size:20px}.blk-md h2{font-size:17px}.blk-md h3{font-size:15px}.blk-md h4{font-size:14px}
.blk-md ul,.blk-md ol{padding-left:22px;margin:6px 0}
.blk-md li{margin:3px 0}
.blk-md a{color:var(--acc)}
.blk-md img{max-width:100%;max-height:360px;object-fit:contain;border-radius:10px;margin:8px 0;background:#000}
.blk-md blockquote{border-left:3px solid var(--acc);padding:2px 0 2px 12px;color:var(--txt2);margin:8px 0}
.blk-md hr{border:none;border-top:1px solid var(--glass-brd);margin:12px 0}
.blk-md code{font-family:monospace;font-size:12.5px;background:rgba(255,255,255,.05);padding:1px 5px;border-radius:4px}
.blk-md pre{margin:8px 0}
.blk-md pre code{display:block;background:#0a0a0a;padding:10px 12px;border-radius:8px;overflow-x:auto;font-size:12.5px;line-height:1.6}
.stat .bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:7px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));border-radius:2px}
.stat.cpu-hi .stat-v{color:var(--warn)}

/* ── gear ── */
.gear-btn{position:fixed;bottom:24px;left:24px;z-index:20;width:36px;height:36px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-brd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .3s;backdrop-filter:blur(10px)}
.gear-btn:hover{border-color:var(--acc);transform:rotate(90deg)}

/* ── settings modal ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-ov.open{opacity:1;pointer-events:auto}
.modal{background:var(--bg2);border:1px solid var(--glass-brd);border-radius:16px;width:520px;max-width:92vw;max-height:85vh;overflow-y:auto;padding:24px;transform:scale(.95);transition:transform .3s}
.modal-ov.open .modal{transform:scale(1)}
.modal h2{font-size:16px;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.modal h2 .x{margin-left:auto;cursor:pointer;color:var(--txt2);font-size:20px;padding:0 4px}
.modal h2 .x:hover{color:var(--txt)}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--glass-brd);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;color:var(--txt2);border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.tab-content{display:none}
.tab-content.active{display:block}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;color:var(--txt2);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select{width:100%;background:var(--bg);border:1px solid var(--glass-brd);border-radius:8px;padding:8px 12px;color:var(--txt);font-size:13px;outline:none;transition:border-color .2s}
.fg input:focus,.fg select:focus{border-color:var(--acc)}
.save-btn{width:100%;padding:9px;background:var(--acc);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;margin-top:8px}
.save-btn:hover{opacity:.85}
.tool-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--glass-brd)}
.tool-row .n{font-family:monospace;font-size:13px;color:var(--acc)}
.tool-row .d{font-size:11px;color:var(--txt2);margin-top:2px}
.tool-row .risk{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:8px}
.risk-low{background:rgba(52,211,153,.15);color:var(--ok)}
.risk-medium{background:rgba(251,191,36,.15);color:var(--warn)}
.risk-high{background:rgba(248,113,113,.15);color:var(--err)}
.svc-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--glass-brd);font-size:13px}
.svc-row .n{font-family:monospace}
.svc-row .st{font-size:11px;color:var(--ok)}
.svc-row .st.pending{color:var(--txt2)}
/* ── capability cards ── */
.cap-row{border:1px solid var(--glass-brd);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:rgba(124,110,228,.04)}
.cap-row .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cap-row .nm{font-family:monospace;font-size:14px;color:var(--acc);font-weight:600}
.cap-row .vis{font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(52,211,153,.12);color:var(--ok);border:1px solid rgba(52,211,153,.25)}
.cap-row .sum{font-size:13px;color:var(--txt);margin-top:5px;line-height:1.45}
.cap-row .desc{font-size:11px;color:var(--txt2);margin-top:5px;line-height:1.5;white-space:pre-line}
.cap-row .provs{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cap-row .plabel{font-size:10px;color:var(--txt2);margin-right:2px}
.pchip{font-size:10px;padding:2px 9px;border-radius:10px;background:var(--bg3);color:var(--txt2);font-family:monospace;border:1px solid var(--glass-brd)}
.cap-row .req{margin-top:7px;font-size:10px;color:var(--txt2);font-family:monospace}
/* ── provider manager (cc-switch style) ── */
.prov-row{border:1px solid var(--glass-brd);border-radius:10px;padding:12px 14px;margin-bottom:10px;transition:border-color .2s,background .2s}
.prov-row.active{border-color:var(--acc);background:rgba(124,110,228,.08)}
.prov-row .top{display:flex;align-items:center;gap:8px}
.prov-row .dot{width:8px;height:8px;border-radius:50%;background:var(--glass-brd);flex:none}
.prov-row.active .dot{background:var(--acc);box-shadow:0 0 8px var(--acc-glow)}
.prov-row .nm{font-size:14px;font-weight:600}
.prov-row .badge{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg3);color:var(--txt2);font-family:monospace}
.prov-row.active .badge{background:rgba(124,110,228,.2);color:var(--acc)}
.prov-row .meta{font-size:11px;color:var(--txt2);margin-top:5px;word-break:break-all}
.prov-row .ops{display:flex;gap:6px;margin-top:10px}
.mini-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--glass-brd);background:var(--bg3);color:var(--txt2);font-size:11px;cursor:pointer;transition:all .2s}
.mini-btn:hover{border-color:var(--acc);color:var(--txt)}
.mini-btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.mini-btn.danger:hover{border-color:var(--err);color:var(--err)}
.model-chip{position:fixed;bottom:26px;left:72px;z-index:20;font-size:11px;color:var(--txt2);display:flex;align-items:center;gap:6px}
.model-chip .live{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}

/* ── toast ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg3);border:1px solid var(--glass-brd);color:var(--txt);padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:200;animation:slideUp .3s}
.toast.error{border-color:var(--err);color:var(--err)}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.typing-dots{display:flex;gap:5px;padding:12px}
.typing-dots span{width:5px;height:5px;background:var(--txt2);border-radius:50%;animation:bnc 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes bnc{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* ── mobile（≤760px）窄屏 / 触屏适配 ──
   纯叠层：桌面段不受影响。手机=横竖都能用：landing 收缩居中、chat 顶条右齿轮 + 底部通栏输入条、
   设置改底部抽屉、宽表格卡片内横滚、触控目标放大、字号防 iOS 聚焦缩放。env(safe-area-inset) 兜刘海。 */
@media (max-width:760px){
  /* landing：logo / 输入框缩放进屏 */
  .state-landing .logo-wrap{top:26%}
  .state-landing .logo-img{width:92px;height:92px}
  .state-landing .logo-ring{top:-8px;left:-8px;right:-8px;bottom:-8px}
  .state-landing .logo-text{font-size:22px;letter-spacing:4px}
  .state-landing .logo-tag{font-size:11.5px;letter-spacing:4px}
  .state-landing .logo-sub{font-size:11px;max-width:86vw;text-align:center;line-height:1.5}
  .state-landing .input-shell{width:min(480px,92vw)}

  /* 顶条：左品牌 · 右齿轮 · 模型芯片居中偏右；聊天态隐藏时钟(手机自带状态栏钟) */
  .state-chat .os-clock{display:none}
  .state-chat .logo-wrap{top:8px;left:12px;gap:7px}
  .state-chat .logo-img{width:26px;height:26px}
  .state-chat .logo-text{font-size:13px;letter-spacing:2px}
  .gear-btn{top:8px;top:calc(8px + env(safe-area-inset-top));left:auto;right:12px;bottom:auto;width:38px;height:38px}
  .model-chip{left:auto;right:60px;bottom:auto;top:14px;top:calc(14px + env(safe-area-inset-top));max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;justify-content:flex-end}

  /* 底部输入条：近满宽、贴底、触控加大（env 刘海兜底） */
  .state-chat .input-shell{width:calc(100vw - 20px);bottom:10px;bottom:calc(10px + env(safe-area-inset-bottom))}
  .input-box{padding:10px 14px;border-radius:22px;gap:8px}
  .input-box input{font-size:16px;min-height:24px}
  .send-ico{width:40px;height:40px;flex:none}
  .send-ico svg{width:18px;height:18px}

  /* 消息区：在顶条与输入条之间通栏，读起来更大 */
  #chatArea{top:48px;bottom:74px;bottom:calc(74px + env(safe-area-inset-bottom));left:0;right:0;padding:8px 12px 4px;gap:12px}
  .msg{max-width:100%}
  .bubble{font-size:15px;line-height:1.66;padding:11px 14px}
  .blk-pg .pg-tt{font-size:18px}

  /* 富内容：宽表格在卡片内横向滚动，不把整页撑破 */
  .blk-tbl{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .blk-tbl th,.blk-tbl td{white-space:nowrap}

  /* 设置：底部抽屉、触控目标放大、表单字号防 iOS 聚焦缩放 */
  .modal-ov{align-items:flex-end}
  .modal{width:100%;max-width:100vw;max-height:90vh;border-radius:18px 18px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom))}
  .tab-bar{overflow-x:auto}
  .tab{flex:1;padding:10px 6px;font-size:13.5px;text-align:center}
  .fg input,.fg select{font-size:16px}
  .save-btn{padding:12px;font-size:16px}
  .mini-btn{padding:7px 13px;font-size:12px}
  .btn{padding:9px 18px;font-size:14px}
  .blk-cfm .btns{flex-wrap:wrap}
}
</style>
</head>
<body class="state-landing"><script>if(location.search.indexOf('lite')>-1)document.body.classList.add('lite')</script>
<div class="stars"></div>
<div class="os-clock"><span class="clk-t" id="clkT">--:--</span><span class="clk-d" id="clkD"></span></div>

<!-- logo -->
<div class="logo-wrap" id="logoWrap">
  <div style="position:relative;display:inline-block">
    <img class="logo-img" src="/logo.png" alt="AION" width="140" height="140">
    <div class="logo-ring"></div>
  </div>
  <div class="logo-text">AION</div>
  <div class="logo-tag">新一代 AI 操作系统</div>
  <div class="logo-sub">你好,欢迎使用 · 输入一句话,AION 帮你在这台电脑上干活</div>
</div>

<!-- input -->
<div class="input-shell" id="inputShell">
  <div class="input-box">
    <input id="msgInput" placeholder="输入你想做的事..." autocomplete="off">
    <button class="send-ico" onclick="send()"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
  </div>
</div>

<!-- chat area -->
<div id="chatArea"></div>

<!-- gear -->
<div class="gear-btn" onclick="openSettings()" title="Settings">⚙️</div>
<div class="model-chip" id="modelChip" style="display:none"><span class="live"></span><span id="modelName"></span></div>

<!-- settings modal -->
<div class="modal-ov" id="settingsModal">
  <div class="modal">
    <h2>⚙️ Settings <span class="x" onclick="closeSettings()">✕</span></h2>
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab('llm',this)">LLM</div>
      <div class="tab" onclick="switchTab('caps',this)">Capabilities</div>
      <div class="tab" onclick="switchTab('tools',this)">Tools</div>
      <div class="tab" onclick="switchTab('services',this)">Services</div>
    </div>
    <div class="tab-content active" id="tab-llm">
      <div id="provList"><p style="color:var(--txt2);font-size:13px">Loading...</p></div>
      <div id="provForm" style="display:none;margin-top:6px;border-top:1px solid var(--glass-brd);padding-top:14px">
        <div class="fg"><label>名称</label><input type="text" id="pName" placeholder="例：智谱 GLM / DeepSeek"></div>
        <div class="fg"><label>协议</label><select id="pProtocol">
          <option value="openai">OpenAI 兼容（{base}/chat/completions）</option>
          <option value="anthropic">Anthropic 兼容（{base}/v1/messages）</option>
        </select></div>
        <div class="fg"><label>预设填充</label><select id="pPreset" onchange="onPresetChange()">
          <option value="">— 选择预设 —</option>
          <option value="zhipu">智谱 GLM（Anthropic）</option>
          <option value="deepseek">DeepSeek</option>
          <option value="openai">OpenAI</option>
          <option value="qwen">Qwen (DashScope)</option>
        </select></div>
        <div class="fg"><label>Base URL</label><input type="text" id="pUrl" placeholder="https://api.deepseek.com/v1"></div>
        <div class="fg"><label>API Key</label><input type="password" id="pKey" placeholder="sk-...（编辑时留空 = 不修改）"></div>
        <div class="fg"><label>Model</label><input type="text" id="pModel" placeholder="deepseek-chat"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="save-btn" style="margin-top:0" onclick="saveProvider()">保存并启用</button>
          <button class="save-btn" style="margin-top:0;background:var(--bg3);color:var(--txt2)" onclick="hideProvForm()">取消</button>
        </div>
      </div>
      <button class="save-btn" id="addProvBtn" style="background:var(--bg3);color:var(--txt)" onclick="showProvForm()">＋ 添加供应商</button>
    </div>
    <div class="tab-content" id="tab-caps">
      <p style="color:var(--txt2);font-size:11px;margin:0 0 10px">目标导向能力 = 给 Agent 的意图接口，内部落到下方叶子执行（AION 自动选）。</p>
      <div id="capsList">Loading...</div>
    </div>
    <div class="tab-content" id="tab-tools">
      <div id="toolsList">Loading...</div>
    </div>
    <div class="tab-content" id="tab-services">
      <div id="servicesList">Loading...</div>
    </div>
  </div>
</div>

<script>
let $=function(s){return document.querySelector(s)};
let chatArea=document.getElementById('chatArea');
let input=document.getElementById('msgInput');
let inChatMode=false;
let currentSession=null;
let streamBusy=false;
let openBubble=null, openAcc='';
let PROV_PRESETS={
  zhipu:{protocol:'anthropic',url:'https://open.bigmodel.cn/api/anthropic',model:'glm-5.3-flash'},
  deepseek:{protocol:'openai',url:'https://api.deepseek.com/v1',model:'deepseek-chat'},
  openai:{protocol:'openai',url:'https://api.openai.com/v1',model:'gpt-4o'},
  qwen:{protocol:'openai',url:'https://dashscope.aliyuncs.com/compatible-mode/v1',model:'qwen-turbo'}
};
let editProvId=null;

// 左上角时钟
function tickClock(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const t=document.getElementById('clkT');
  if(t)t.textContent=p(d.getHours())+':'+p(d.getMinutes());
  const dt=document.getElementById('clkD');
  if(dt)dt.textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 周'+'日一二三四五六'[d.getDay()];
}
setInterval(tickClock,1000);tickClock();

// init
async function init(){
  try{
    let[h,t]=await Promise.all([fetch('/api/health').then(r=>r.json()),fetch('/api/tools').then(r=>r.json())]);
    renderCaps(t.tools||[]);renderTools(t.tools||[]);
    renderServices(h.services||[]);
    updateModelChip(h.llm);
  }catch(e){console.error(e)}
  loadProviders();
  input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  input.focus();
}

// ── LLM provider manager（cc-switch 风格）──
async function loadProviders(){
  try{
    let d=await fetch('/api/llm/providers').then(function(r){return r.json()});
    renderProviders(d.providers||[],d.active);
  }catch(e){
    document.getElementById('provList').innerHTML='<p style="color:var(--err);font-size:13px">加载失败: '+esc(e.message)+'</p>';
  }
}

function renderProviders(providers,activeId){
  let el=document.getElementById('provList');
  if(!providers.length){
    el.innerHTML='<p style="color:var(--txt2);font-size:13px;margin-bottom:10px">尚未配置供应商，当前使用内置 Echo 后端。点击下方「添加供应商」接入真实 LLM。</p>';
    return;
  }
  el.innerHTML='';
  providers.forEach(function(p){
    let row=document.createElement('div');
    row.className='prov-row'+(p.active?' active':'');
    let meta=esc(p.model)+' · '+esc(p.base_url)+(p.has_key?'':' · <span style="color:var(--warn)">未设置 Key</span>');
    row.innerHTML='<div class="top"><span class="dot"></span><span class="nm">'+esc(p.name)+'</span><span class="badge">'+esc(p.protocol)+'</span></div>'
      +'<div class="meta">'+meta+'</div>'
      +'<div class="ops">'
      +(p.active?'':'<button class="mini-btn primary" onclick="activateProvider(\''+esc(p.id)+'\')">启用</button>')
      +'<button class="mini-btn" onclick="testProvider(\''+esc(p.id)+'\')">测试</button>'
      +'<button class="mini-btn" onclick="editProvider(\''+esc(p.id)+'\')">编辑</button>'
      +'<button class="mini-btn danger" onclick="deleteProvider(\''+esc(p.id)+'\')">删除</button>'
      +(p.active?'<span style="margin-left:auto;font-size:11px;color:var(--acc);align-self:center">✓ 当前使用</span>':'')
      +'</div>';
    el.appendChild(row);
  });
}

function updateModelChip(llm){
  let chip=document.getElementById('modelChip');
  if(llm&&llm.name){
    chip.style.display='flex';
    document.getElementById('modelName').textContent=llm.name+' · '+llm.model;
  }else{
    chip.style.display='none';
  }
}

function showProvForm(){
  editProvId=null;
  document.getElementById('provForm').style.display='block';
  document.getElementById('addProvBtn').style.display='none';
  ['pName','pUrl','pKey','pModel'].forEach(function(id){document.getElementById(id).value=''});
  document.getElementById('pProtocol').value='openai';
  document.getElementById('pPreset').value='';
  document.getElementById('pName').focus();
}
function hideProvForm(){
  document.getElementById('provForm').style.display='none';
  document.getElementById('addProvBtn').style.display='block';
  editProvId=null;
}
function onPresetChange(){
  let key=document.getElementById('pPreset').value;
  let p=PROV_PRESETS[key];
  if(!p)return;
  document.getElementById('pProtocol').value=p.protocol;
  document.getElementById('pUrl').value=p.url;
  document.getElementById('pModel').value=p.model;
}

async function saveProvider(){
  let body={
    name:document.getElementById('pName').value.trim(),
    protocol:document.getElementById('pProtocol').value,
    base_url:document.getElementById('pUrl').value.trim(),
    api_key:document.getElementById('pKey').value,
    model:document.getElementById('pModel').value.trim(),
    activate:true
  };
  if(editProvId)body.id=editProvId;
  if(!body.name){showToast('请填写供应商名称','error');return}
  if(!body.base_url||!body.model){showToast('Base URL 与 Model 不能为空','error');return}
  if(!editProvId&&!body.api_key){showToast('请填写 API Key','error');return}
  try{
    let r=await fetch('/api/llm/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    let d=await r.json();
    if(d.status==='ok'){
      showToast('✅ '+body.name+' 已启用');
      hideProvForm();
      await loadProviders();
      refreshHealth();
    }else{showToast('保存失败: '+(d.error||'未知错误'),'error')}
  }catch(e){showToast('保存失败: '+e.message,'error')}
}

function editProvider(id){
  let d=allProvidersCache.find(function(p){return p.id===id});
  if(!d)return;
  editProvId=id;
  document.getElementById('provForm').style.display='block';
  document.getElementById('addProvBtn').style.display='none';
  document.getElementById('pName').value=d.name;
  document.getElementById('pProtocol').value=d.protocol;
  document.getElementById('pUrl').value=d.base_url;
  document.getElementById('pKey').value='';
  document.getElementById('pKey').placeholder=d.has_key?'已设置（留空 = 不修改）':'sk-...';
  document.getElementById('pModel').value=d.model;
  document.getElementById('pPreset').value='';
}

async function activateProvider(id){
  try{
    let r=await fetch('/api/llm/providers/'+id+'/activate',{method:'POST'});
    let d=await r.json();
    if(d.status==='ok'){showToast('✅ 已切换');await loadProviders();refreshHealth()}
    else showToast('切换失败: '+(d.error||''),'error');
  }catch(e){showToast('切换失败: '+e.message,'error')}
}

async function deleteProvider(id){
  if(!confirm('确定删除该供应商配置？'))return;
  try{
    let r=await fetch('/api/llm/providers/'+id,{method:'DELETE'});
    let d=await r.json();
    if(d.status==='ok'){showToast('已删除');await loadProviders();refreshHealth()}
    else showToast('删除失败: '+(d.error||''),'error');
  }catch(e){showToast('删除失败: '+e.message,'error')}
}

async function testProvider(id){
  showToast('测试中...');
  try{
    let r=await fetch('/api/llm/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})});
    let d=await r.json();
    if(d.status==='ok')showToast('✅ 连通正常: '+String(d.reply).substring(0,40));
    else showToast('❌ '+(d.error||'测试失败').substring(0,120),'error');
  }catch(e){showToast('❌ '+e.message,'error')}
}

let allProvidersCache=[];
function cacheProviders(list){allProvidersCache=list}
let _origRender=renderProviders;
renderProviders=function(list,activeId){allProvidersCache=list;_origRender(list,activeId)};

async function refreshHealth(){
  try{
    let h=await fetch('/api/health').then(function(r){return r.json()});
    updateModelChip(h.llm);
    renderServices(h.services||[]);
  }catch(e){}
}

// 叶子工具清单：能力已被 Capabilities tab 收走，这里只列 kind=tool 的执行原语；
// 标注哪些已被能力收编为 provider（不对模型暴露）、哪些还裸奔暴露给模型。
function renderTools(tools){
  let el=document.getElementById('toolsList');
  let caps=(tools||[]).filter(function(x){return x.kind==='capability'});
  let leaves=(tools||[]).filter(function(x){return x.kind==='tool'});
  if(!leaves.length){el.innerHTML='<p style="color:var(--txt2);font-size:13px">No leaf tools registered</p>';return}
  // 被某能力收编的叶子（provider）→ 不对模型暴露
  let provSet={};
  caps.forEach(function(c){(c.providers||[]).forEach(function(p){provSet[p]=1})});
  el.innerHTML='';
  leaves.forEach(function(t){
    let tag=provSet[t.name]
      ?'<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg3);color:var(--txt2);margin-left:6px">已收编 · provider</span>'
      :'<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(124,110,228,.15);color:var(--acc);margin-left:6px">暴露给模型</span>';
    let d=document.createElement('div');d.className='tool-row';
    d.innerHTML='<div style="width:100%"><div><span class="n">'+t.name+'</span><span class="risk risk-'+t.risk+'">'+t.risk+'</span>'+tag+'</div><div class="d">'+esc(t.description)+'</div></div>';
    el.appendChild(d);
  });
}

// Capability 卡片：每个能力 = 给 Agent 的目标接口，列出其下的 provider 叶子。
function renderCaps(tools){
  let el=document.getElementById('capsList');
  let caps=(tools||[]).filter(function(x){return x.kind==='capability'});
  if(!caps.length){el.innerHTML='<p style="color:var(--txt2);font-size:13px">No capabilities registered</p>';return}
  el.innerHTML='';
  caps.forEach(function(c){
    let chips=(c.providers||[]).map(function(p){return '<span class="pchip">'+esc(p)+'</span>'}).join('');
    let req=(c.required_caps||[]).join(', ');
    let d=document.createElement('div');d.className='cap-row';
    d.innerHTML=
      '<div class="top"><span class="nm">'+esc(c.name)+'</span>'+
      '<span class="vis">暴露给模型</span>'+
      '<span class="risk risk-'+c.risk+'">'+c.risk+'</span></div>'+
      '<div class="sum">'+esc(c.summary)+'</div>'+
      (c.description?'<div class="desc">'+esc(c.description)+'</div>':'')+
      (chips?'<div class="provs"><span class="plabel">↓ provider</span>'+chips+'</div>':'')+
      (req?'<div class="req">required_caps: '+esc(req)+'</div>':'');
    el.appendChild(d);
  });
}

function renderServices(svcs){
  let el=document.getElementById('servicesList');

// transition landing → chat
function enterChatMode(){
  if(inChatMode)return;
  inChatMode=true;
  document.body.classList.remove('state-landing');
  document.body.classList.add('state-chat');
  setTimeout(function(){input.focus()},800);
}

// send
async function send(){
  let text=input.value.trim();
  if(!text||streamBusy)return;
  input.value='';
  enterChatMode();
  addUserMsg(text);
  await sendRaw({message:text});
}

function addTyping(){
  let t=document.createElement('div');t.className='msg assistant typing-holder';
  t.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
  chatArea.appendChild(t);scrollBtm();
}
function removeTyping(){let t=chatArea.querySelector('.typing-holder');if(t)t.remove()}

// 走 SSE 流式端点；会话 ID 跨轮保持，服务端不可用时回退一次性 /api/chat
async function sendRaw(body){
  if(streamBusy)return;
  streamBusy=true;
  if(currentSession&&!body.session_id)body=Object.assign({},body,{session_id:currentSession});
  openBubble=null;openAcc='';
  addTyping();
  try{
    let resp=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!resp.ok||!resp.body)throw new Error('HTTP '+resp.status);
    await consumeSSE(resp);
  }catch(e){
    removeTyping();openBubble=null;openAcc='';
    try{
      let r2=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r2.ok)throw new Error('HTTP '+r2.status);
      let data=await r2.json();
      removeTyping();
      addAssistantMsg(data.reply_text||'',data.blocks||[]);
    }catch(e2){
      removeTyping();
      addAssistantMsg('⚠️ '+(e2.message||'error'));
    }
  }finally{streamBusy=false;removeTyping()}
}

async function consumeSSE(resp){
  const reader=resp.body.getReader();
  const dec=new TextDecoder();
  let buf='';
  for(;;){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let nl;
    while((nl=buf.indexOf('\n'))>=0){
      let line=buf.slice(0,nl);buf=buf.slice(nl+1);
      if(line.charAt(line.length-1)==='\r')line=line.slice(0,-1);
      if(line.slice(0,5)!=='data:')continue;
      let payload=line.slice(5);
      if(payload.charAt(0)===' ')payload=payload.slice(1);
      if(!payload)continue;
      let ev;try{ev=JSON.parse(payload)}catch(err){continue}
      onSSE(ev);
    }
  }
}

function onSSE(ev){
  switch(ev.type){
    case'start':
      if(ev.session_id)currentSession=ev.session_id;
      break;
    case'delta':
      removeTyping();
      if(!openBubble){openBubble=makeStreamBubble();openAcc=''}
      openAcc+=(ev.text||'');
      openBubble.querySelector('.bubble').innerHTML=md(openAcc);
      scrollBtm();
      break;
    case'seal':
      removeTyping();
      if(openBubble){
        if(ev.final!==undefined&&ev.final!==null&&ev.final!=='')
          openBubble.querySelector('.bubble').innerHTML=md(ev.final);
        openBubble=null;openAcc='';
      }
      break;
    case'tool':
      removeTyping();openBubble=null;openAcc='';
      appendChip('🔧 '+(ev.tool||'tool')+(ev.command?' → $ '+ev.command:''));
      break;
    case'terminal':case'confirmation':case'table':case'file':case'image':
    case'chart':case'markdown':case'stats':case'process':case'rich':case'webpage':case'page':
      removeTyping();openBubble=null;openAcc='';
      appendBlock(ev);
      break;
    case'error':
      removeTyping();openBubble=null;openAcc='';
      addAssistantMsg('⚠️ '+(ev.message||'error'));
      break;
    case'done':
      removeTyping();openBubble=null;openAcc='';
      if(ev.session_id)currentSession=ev.session_id;
      break;
  }
}

function makeStreamBubble(){
  let d=document.createElement('div');d.className='msg assistant';
  d.innerHTML='<div class="bubble"></div>';
  chatArea.appendChild(d);scrollBtm();
  return d;
}
function appendChip(text){

  chatArea.appendChild(d);scrollBtm();
}
function appendTerminal(b){
  let d=document.createElement('div');d.className='msg assistant';
  d.innerHTML=renderBlock({type:'terminal',command:b.command,output:b.output,stderr:b.stderr,code:b.code,timed_out:b.timed_out});

}
// 通用整块渲染：terminal / confirmation / table / file / image 事件走这里
function appendBlock(b){
  let html=renderBlock(b);
  if(!html)return;
  let d=document.createElement('div');d.className='msg assistant';
  d.innerHTML=html;
  chatArea.appendChild(d);scrollBtm();
}

function addUserMsg(text){
  let d=document.createElement('div');d.className='msg user';
  d.innerHTML='<div class="bubble">'+esc(text)+'</div>';
  chatArea.appendChild(d);scrollBtm();
}

// blocks 是唯一渲染源：每个 text 块 = 一个气泡，terminal 独立成块 —— 不再叠加 reply_text
function addAssistantMsg(reply,blocks){
  let bs=(blocks&&blocks.length)?blocks:(reply?[{type:'text',markdown:reply}]:[]);
  let html=bs.map(renderBlock).join('');
  if(!html)return;
  let d=document.createElement('div');d.className='msg assistant';
  d.innerHTML=html;
  chatArea.appendChild(d);scrollBtm();
}

function renderBlock(b){
  if(!b||!b.type)return'';
  switch(b.type){
    case'text':return'<div class="bubble">'+md(b.markdown||'')+'</div>';
    case'terminal':{
      let h='<div class="blk-term">';
      if(b.command)h+='<div class="term-cmd"><span class="pr">$</span> '+esc(b.command)+'</div>';
      let hasOut=b.output&&b.output.trim();
      let hasErr=b.stderr&&b.stderr.trim();
      if(hasOut)h+='<pre class="term-out">'+esc(b.output)+'</pre>';
      if(hasErr)h+='<pre class="term-out" style="color:#f85149">'+esc(b.stderr)+'</pre>';
      if(!hasOut&&!hasErr)h+='<pre class="term-out">(无输出)</pre>';
      let tag='';
      if(b.timed_out)tag='⏱ 执行超时';
      else if(b.code===0||b.code===null||b.code===undefined)tag='✓ exit 0';
      else if(b.code===-1)tag='';
      else tag='exit '+b.code;
      if(tag)h+='<div class="term-tag">'+tag+'</div>';
      return h+'</div>';
    }
    case'table':return renderTable(b);
    case'confirmation':return renderConfirm(b);
    case'markdown':return'<div class="blk-md">'+md(b.source||b.markdown||'')+'</div>';
    case'rich':return'<div class="blk-md">'+md(b.markdown||'')+'</div>';
    case'image':return renderImage(b);
    case'file':return renderFile(b);
    case'chart':return renderChart(b);
    case'stats':return renderStats(b);
    case'process':return renderProcess(b);
    case'webpage':return renderWebpage(b);
    case'page':return renderPage(b);
    case'launch':return renderLaunch(b);
    default:return'';
  }
}

// 网页感卡片渲染器：AION 自己把站点结构排成原生 DOM（顶栏导航/hero logo/
// 搜索框/页脚）。站点主色仅接受 #hex，图片仅 http(s)，其余一律转义。
function safeColor(c){
  return(/^#[0-9a-fA-F]{3,8}$/.test(c||''))?c:'';
}
function renderWebpage(b){
  let c=safeColor(b.color)||'#1E6FFF';
  function A(o){
    if(!o||!o.url||!/^https?:\/\//i.test(o.url))return'';
    return'<a href="'+escA(o.url)+'" target="_blank" rel="noopener">'+esc(o.text||o.url)+'</a>';
  }
  function sep(list){return list.filter(Boolean).join('<i class="sp"></i>');}
  let nav=sep((b.nav||[]).map(A));
  let foot=sep((b.footer||[]).map(A));
  let brandName=esc(b.brand||b.title||'');
  let lg=(b.logo&&/^https?:\/\//i.test(b.logo))
    ?'<img class="lg" src="'+escA(b.logo)+'" alt="logo" onerror="this.remove()">':'';
  let top='<div class="top">'+(nav?'<div class="nav">'+nav+'</div>':'')+
    (brandName?'<div class="brd" style="color:'+c+'">'+brandName+'</div>':'')+'</div>';
  let hero=(lg||brandName||b.tagline)?'<div class="hero">'+
    (lg||'<div class="nm" style="color:'+c+'">'+brandName+'</div>')+
    (b.tagline?'<div class="tg">'+esc(b.tagline)+'</div>':'')+'</div>':'';
  let s=b.search||null;
  let sr='';
  if(s&&s!==null){
    let ph=s.placeholder||('在'+esc(b.brand||'站内')+'搜索');
    sr='<div class="srch"><div class="in"><input class="q" readonly placeholder="'+escA(ph)+'">'+
       '<span class="go" style="background:'+c+'">'+esc(s.button||'搜索')+'</span></div></div>';
  }
  let footRow='';
  if(foot||b.meta){
    footRow='<div class="foot">'+(foot?'<span class="fl">'+foot+'</span>':'')+
      (b.meta?'<span class="mt">'+esc(b.meta)+'</span>':'')+'</div>';
  }
  return'<div class="blk-wp">'+top+hero+sr+footRow+'</div>';
}

// —— 正文结构卡片（page 块）—— Moli 页内抽出的 DOM 结构 → 原生排版 ——
// header 行（site 徽 + 标题 + 链接 + meta）、标题/段落/列表/图/引用逐块排；
// host 派生强调色 accent（CSS 接受 hsl()），全部转义防注入。
function pgLinkA(o){
  if(!o||!o.href||!/^https?:\/\//i.test(o.href))return'';
  return'<a href="'+escA(o.href)+'" target="_blank" rel="noopener">'+esc(o.text||o.href)+'</a>';
}
function renderPage(b){
  let accent=/^hsl\(/.test(b.accent||'')?(b.accent):'hsl(214,85%,56%)';
  let blocks=Array.isArray(b.blocks)?b.blocks:[];
  let nav=((b.nav||[]).map(pgLinkA).filter(Boolean)).slice(0,6)
    .join('<i class="sp"></i>');
  let html='';
  for(const bl of blocks){
    if(!bl||typeof bl!=='object')continue;
    if(typeof bl.h==='number'&&bl.t!==undefined){
      let lv=Math.min(3,Math.max(1,Math.floor(bl.h||0)||1));
      if(lv===1)html+='<div class="pg-h1">'+esc(bl.t)+'</div>';
      else if(lv===2)html+='<div class="pg-h2"><span style="background:'+accent+'"></span>'+esc(bl.t)+'</div>';
      else html+='<div class="pg-h3">'+esc(bl.t)+'</div>';
    }else if(bl.p!==undefined){
      html+='<p class="pg-p">'+esc(bl.p)+'</p>';
    }else if(Array.isArray(bl.list)){
      let li=bl.list.map(x=>'<li>'+esc(x)+'</li>').join('');
      html+='<'+((bl.ordered)?'ol':'ul')+' class="pg-li">'+li+'</'+((bl.ordered)?'ol':'ul')+'>';
    }else if(bl.quote!==undefined){
      html+='<blockquote class="pg-q">'+esc(bl.quote)+'</blockquote>';
    }else if(bl.img&&/^https?:\/\//i.test(bl.img)){
      html+='<div class="pg-img"><img loading="lazy" src="'+escA(bl.img)+'" alt="'+escA(bl.alt||'')+'" onerror="this.closest(\'.pg-img\').remove()"></div>';
    }
  }
  if(!html)html='<p class="pg-p">（Moli 未抽到正文结构）</p>';
  let title=esc(b.title||b.host||'');
  let urlLine=(b.url&&/^https?:\/\//i.test(b.url))
    ?'<a class="pg-url" href="'+escA(b.url)+'" target="_blank" rel="noopener">'+esc(b.host||b.url)+'</a>':'';
  let top='<div class="top">'
    +(b.host?'<span class="pg-fav" style="background:'+accent+'">'+esc((b.host[0]||'?').toUpperCase())+'</span>':'')
    +(nav?'<div class="nav">'+nav+'</div>':'')
    +(b.meta?'<span class="mt pg-meta">'+esc(b.meta)+'</span>':'')+'</div>';
  let head='<div class="pg-head"><div class="pg-tt">'+title+'</div>'+urlLine+'</div>';
  return'<div class="blk-pg" style="--ac:'+accent+'">'+top+head+
    '<div class="pg-body">'+html+'</div></div>';
}
function renderStats(b){
  let s=b.data||b,html='<div class="blk-stats">';
  // CPU：换算 busy 比例（user+system+nice vs total，越忙越偏暖色）
  if(s.cpu){
    let u=+s.cpu.user||0,n=+s.cpu.nice||0,sy=+s.cpu.system||0,id=+s.cpu.idle||0,iw=+s.cpu.iowait||0;
    let tot=u+n+sy+id+iw,busy=tot-id;
    let pct=tot?Math.round(busy/tot*100):0;
    let cls=pct>80?' stat cpu-hi':'';
    html+='<div class="stat'+cls+'"><div class="stat-v">'+pct+'%</div><div class="stat-l">CPU busy</div>'
      +'<div class="bar"><i style="width:'+Math.min(100,pct)+'%"></i></div></div>';
  }
  // Memory：已用 / 总量 + 占用条
  if(s.memory){
    let total=+s.memory.total_bytes||0,used=total-(+s.memory.available_bytes||total);
    let pct=total?Math.round(used/total*100):0;
    html+='<div class="stat"><div class="stat-v">'+fmtGB(used)+'</div><div class="stat-l">内存 '+pct+'% · '+fmtGB(total)+'</div>'
      +'<div class="bar"><i style="width:'+Math.min(100,pct)+'%"></i></div></div>';
  }
  // Load
  if(s.load){
    let a=s.load.load1,b5=s.load.load5,c=s.load.load15;
    html+='<div class="stat"><div class="stat-v">'+(fmt1(a))+'</div><div class="stat-l">Load 1m / '+fmt1(b5)+' / '+fmt1(c)+'</div></div>';
  }
  // Uptime
  if(s.uptime_seconds)html+='<div class="stat"><div class="stat-v">'+fmtUp(s.uptime_seconds)+'</div><div class="stat-l">运行时长</div></div>';
  return html+'</div>';
}
function fmt1(v){if(v===undefined||v===null||isNaN(v))return'-';return String(Math.round(v*100)/100)}

function renderTable(b){
  let h=b.headers||[],r=b.rows||[];
  let html=(b.caption?'<div class="blk-cap">'+esc(b.caption)+'</div>':'');
  html+='<table class="blk-tbl"><tr>';
  h.forEach(function(x){html+='<th>'+esc(x)+'</th>'});
  html+='</tr>';
  r.forEach(function(row){html+='<tr>';row.forEach(function(c){html+='<td>'+esc(String(c))+'</td>'});html+='</tr>'});
  return html+'</table>';
}

// ── image 块：AION 原生展示网页/接口抓来的图片 ──
function renderImage(b){
  let src=b.src||'';
  if(!src)return'';
  let dim=(b.width||b.height)?' style="max-width:'+Number(b.width||720)+'px"' :'';

// 图片加载失败兜底：隐藏坏图，标注来源不可达
function imgErr(el){
  let alt=el.getAttribute('alt')||el.getAttribute('src')||'';
  let cap=el.parentNode.querySelector('.cap');
  el.remove();
  if(cap)cap.textContent='⚠️ 图片不可达：'+alt;
}

// ── file 块：文件展示（路径/类型/大小/徽标） ──
function renderFile(b){
  let path=b.path||b.name||'';
  let kind=b.kind||'';
  let badge={source:'源文件',generated:'生成',downloadable:'⬇ 可下载'}[kind]||kind;
  let size=b.size?fmtBytes(b.size):'';
  let mime=b.mime||'';
  let ico=fileIcon(mime,path);
  let meta=[mime,size].filter(Boolean).join(' · ');
  let html='<div class="blk-file"><span class="ico">'+ico+'</span>'
    +'<div class="mid"><div class="path">'+esc(path)+'</div>'
    +(meta?'<div class="meta">'+esc(meta)+'</div>':'')
    +'</div>'+(badge?'<span class="badge">'+esc(badge)+'</span>':'')+'</div>';
  return html;
}
function fileIcon(mime,path){
  if(mime&&mime.indexOf('image/')===0)return'🖼️';
  if(mime&&mime.indexOf('pdf')>=0)return'📕';
  if(mime&&mime.indexOf('text/')===0)return'📄';
  if(mime&&(mime.indexOf('json')>=0||mime.indexOf('javascript')>=0))return'{}';
  let m=(mime||'').toLowerCase();
  if(m.indexOf('html')>=0)return'🌐';
  if(path&&/\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(path))return'🖼️';
  if(path&&/\.(mp3|wav|flac)$/i.test(path))return'🎵';
  if(path&&/\.(mp4|mkv|webm)$/i.test(path))return'🎬';
  return'📦';
}
function fmtBytes(n){
  if(!n&&n!==0)return'';
  let u=['B','KB','MB','GB','TB'],i=0;n=Number(n)||0;
  while(n>=1024&&i<u.length-1){n/=1024;i++}
  return(n.toFixed(n>=100?0:n>=10?1:2))+' '+u[i];
}

// ── chart 块：折线 / 柱状 / 散点（SVG） ──
var CHART_COLORS=['#7c6ee4','#34d399','#60a5fa','#fbbf24','#f472b6','#22d3ee','#fb923c','#a78bfa'];
function renderChart(b){
  let kind=b.kind||'line';
  let title=b.title||'';
  let header='<div class="ct">'+esc(title)+'</div>';
  let body='';
  if(kind==='bar')body=chartBars(b);
  else if(kind==='points')body=chartScatter(b);
  else body=chartLines(b);
  if(!body)return'<div class="blk-chart">'+header+'<div style="color:var(--txt2);font-size:12px;padding:6px 2px">(暂无数据)</div></div>';
  return'<div class="blk-chart">'+header+body+'</div>';
}
function chartLegend(series){
  if(!series||!series.length)return'';
  return'<div class="cl">'+series.map(function(s,i){
    return'<span><i style="background:'+CHART_COLORS[i%CHART_COLORS.length]+'"></i>'+esc(s.name||('系列'+(i+1)))+'</span>'
  }).join('')+'</div>';
}
function chartLines(b){
  let series=(b.series||[]).filter(function(s){return s&&(s.points||[]).length});
  if(!series.length)return'';
  // 汇集全部点求范围
  let all=[],pointsOf=function(s){return s.points||[]};
  series.forEach(function(s){all=all.concat(pointsOf(s))});
  let x0=Math.min.apply(null,all.map(function(p){return p.x})),x1=Math.max.apply(null,all.map(function(p){return p.x}));
  let y0=Math.min.apply(null,all.map(function(p){return p.y})),y1=Math.max.apply(null,all.map(function(p){return p.y}));
  if(x0===x1){x0-=1;x1+=1}if(y0===y1){y0-=1;y1+=1}
  let pad=(x1-x0)*.05,W=640,H=220,L=42,R=14,T=12,B=26;
  let sx=function(x){return L+(x-x0)/(x1-x0)*(W-L-R)};
  let sy=function(y){return T+(1-(y-y0)/(y1-y0))*(H-T-B)};
  let svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  // 网格 + y 轴刻度
  for(let i=0;i<=4;i++){
    let y=y0+(y1-y0)*i/4,yy=sy(y);
    svg+='<line class="gl" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/>';
    svg+='<text class="ax" x="'+(L-6)+'" y="'+(yy+3)+'" text-anchor="end">'+fmtNum(y)+'</text>';
  }
  // x 轴刻度（最多 5 个）
  let xt=Math.min(5,all.length);
  for(let i=0;i<xt;i++){
    let xi=Math.round(i*(all.length-1)/(xt-1||1)),x=all[xi].x;
    svg+='<text class="ax" x="'+sx(x)+'" y="'+(H-8)+'" text-anchor="middle">'+fmtNum(x)+'</text>';
  }
  series.forEach(function(s,si){
    let col=CHART_COLORS[si%CHART_COLORS.length];
    let d=pointsOf(s).map(function(p,i){return(i?'L':'M')+sx(p.x)+' '+sy(p.y)}).join(' ');
    svg+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    pointsOf(s).forEach(function(p){
      svg+='<circle cx="'+sx(p.x)+'" cy="'+sy(p.y)+'" r="2.6" fill="'+col+'"/>';
    });
  });
  svg+='</svg>';
  return chartLegend(series)+svg;
}
function chartBars(b){
  let bars=(b.bars||[]).filter(function(x){return x});
  if(!bars.length)return'';
  let max=Math.max.apply(null,bars.map(function(x){return x.value||0}))||1;
  let W=640,H=220,L=42,R=14,T=16,B=34;
  let n=bars.length,slot=(W-L-R)/n,bw=Math.min(64,slot*.62);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  for(let i=0;i<=4;i++){
    let y=max*i/4,yy=T+(1-i/4)*(H-T-B);
    svg+='<line class="gl" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/>';
    svg+='<text class="ax" x="'+(L-6)+'" y="'+(yy+3)+'" text-anchor="end">'+fmtNum(y)+'</text>';
  }
  bars.forEach(function(x,i){
    let cx=L+slot*i+slot/2,h=(x.value/max)*(H-T-B),col=CHART_COLORS[i%CHART_COLORS.length];
    let label=x.label||(''+(i+1));
    svg+='<rect x="'+(cx-bw/2)+'" y="'+(T+H-T-B-h)+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+col+'" opacity=".9"/>';
    svg+='<text x="'+cx+'" y="'+(T+H-T-B-h-5)+'" text-anchor="middle" fill="#eaeaf0" font-size="10">'+fmtNum(x.value)+'</text>';
    // 柱底标签：过长则截断
    let t=label.length>8?label.slice(0,8)+'…':label;
    if(n<=12)svg+='<text class="ax" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(t)+'</text>';
  });
  svg+='</svg>';
  let legend=chartLegend(bars.map(function(x,i){return{name:x.label}}));
  return legend+svg;
}
function chartScatter(b){
  let series=(b.series||[]).filter(function(s){return s&&(s.points||[]).length});
  if(!series.length)return'';
  let all=[];series.forEach(function(s){all=all.concat(s.points)});
  let x0=Math.min.apply(null,all.map(function(p){return p.x})),x1=Math.max.apply(null,all.map(function(p){return p.x}));
  let y0=Math.min.apply(null,all.map(function(p){return p.y})),y1=Math.max.apply(null,all.map(function(p){return p.y}));
  if(x0===x1){x0-=1;x1+=1}if(y0===y1){y0-=1;y1+=1}
  let W=640,H=220,L=42,R=14,T=12,B=26;
  let sx=function(x){return L+(x-x0)/(x1-x0)*(W-L-R)};
  let sy=function(y){return T+(1-(y-y0)/(y1-y0))*(H-T-B)};
  let svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  for(let i=0;i<=4;i++){
    let y=y0+(y1-y0)*i/4,yy=sy(y);
    svg+='<line class="gl" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/>';
    svg+='<text class="ax" x="'+(L-6)+'" y="'+(yy+3)+'" text-anchor="end">'+fmtNum(y)+'</text>';
  }
  series.forEach(function(s,si){
    let col=CHART_COLORS[si%CHART_COLORS.length];
    s.points.forEach(function(p){
      svg+='<circle cx="'+sx(p.x)+'" cy="'+sy(p.y)+'" r="3.4" fill="'+col+'" opacity=".85"/>';
    });
  });
  svg+='</svg>';
  return chartLegend(series)+svg;
}
function fmtNum(v){
  v=Number(v);if(!isFinite(v))return'';
  if(Math.abs(v)>=1000)return(v/1000).toFixed(1)+'k';
  return String(Math.round(v*100)/100);
}

// ── process 块：进程列表（带状态点） ──
function renderProcess(b){
  let items=(b.data&&b.data.processes)||b.items||[];
  if(items.length){
    // 数据驱动列：取首元素键作列头（有偏好顺序则用之）
    let order=b.headers||['ticket_id','pid','sandboxed','cgroup','name','command','state'];
    let keys=order.filter(function(k){return k in items[0]});
    if(!keys.length)keys=Object.keys(items[0]);
    let fmt=function(v){
      if(v===null||v===undefined)return'—';
      if(typeof v==='boolean')return v?'yes':'';
      if(typeof v==='object'){try{return JSON.stringify(v)}catch(e){return'…'}}
      return String(v);
    };
    let rows=items.map(function(p){return keys.map(function(k){return fmt(p[k])})});
    let html='<table class="blk-tbl"><tr>';
    keys.forEach(function(x){html+='<th>'+esc(x)+'</th>'});
    html+='</tr>';
    rows.forEach(function(row){html+='<tr>';row.forEach(function(c){html+='<td>'+esc(c)+'</td>'});html+='</tr>'});
    return html+'</table>';
  }
  let lines=b.data||b;
  if(lines&&lines.raw)return'<div class="blk-term">'+esc(lines.raw)+'</div>';
  return'<div class="blk-md">'+md(b.markdown||'进程状态')+'</div>';
}

// 用户点同意/拒绝 → 走 POST /api/action 恢复那次被挂起的工具调用
async function confirmAction(btn){
  let rid=btn.getAttribute('data-rid'),choice=btn.getAttribute('data-choice');
  let group=btn.parentNode.querySelectorAll('button');
  group.forEach(function(x){x.disabled=true});
  let action=choice==='confirm'
    ?{kind:'confirm',request_id:rid,choice:choice}
    :{kind:'cancel',request_id:rid};
  try{
    let r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:currentSession||undefined,action:action})});
    let data=await r.json();
    if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
    if(data.session_id)currentSession=data.session_id;
    addAssistantMsg(data.reply_text||'',data.blocks||[]);
    scrollBtm();
  }catch(e){
    group.forEach(function(x){x.disabled=false});
    addAssistantMsg('⚠️ '+(e.message||'action 失败'),[]);
  }
}

// settings
function openSettings(){
  document.getElementById('settingsModal').classList.add('open');
  refreshToolsAndServices();
  loadProviders();
}
function closeSettings(){document.getElementById('settingsModal').classList.remove('open')}
function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(function(t){t.classList.remove('active')});
  document.getElementById('tab-'+name).classList.add('active');
}

async function refreshToolsAndServices(){
  try{
    let[h,t]=await Promise.all([fetch('/api/health').then(function(r){return r.json()}),fetch('/api/tools').then(function(r){return r.json()})]);
    renderCaps(t.tools||[]);renderTools(t.tools||[]);renderServices(h.services||[]);
  }catch(e){}
}

// utils
function esc(s){let d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
// 属性专用转义：esc 已把 &<> 实体化，这里只补压双引号防属性逃逸
function escA(s){return(s||'').replace(/"/g,'&quot;')}
// 迷你 markdown 渲染器：AION 原生重排网页/文本内容的渲染内核。
// 顺序：先抽出代码块 → 整段转义防注入 → 行内格式 → 逐行块结构。
function md(s){
  if(!s)return'';
  let tokens=[];
  // 1) 保护围栏代码块（内容可含换行/特殊字符）
  let t=s.replace(/```([\w-]*)\n?([\s\S]*?)```/g,function(_,l,c){
    let tok='@@C'+(tokens.length)+'@@';
    tokens.push('<pre><code class="lang-'+esc(l||'')+'">'+esc(c)+'</code></pre>');
    return tok;
  });
  // 2) 转义其余内容（防注入）
  t=esc(t);
  // 3) 行内格式：行内码 / 加粗 / 斜体 / 链接 / 图片
  //    t 已整段 esc（&<> 已实体化），属性值只需 escA 压双引号防属性逃逸；
  //    不可再整体 esc，否则 &amp; 会被二次编码成 &amp;amp;。
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>')
    .replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g,function(_,a,u){
      return'<img src="'+escA(u)+'" alt="'+escA(a)+'" loading="lazy" onerror="this.style.display=\'none\'">';
    })
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,function(_,txt,u){
      return'<a href="'+escA(u)+'" target="_blank" rel="noopener">'+txt+'</a>';
    });
  // 4) 逐行块结构
  let html=[],para=[],inList=false,listTag='';
  function flushPara(){if(para.length){html.push('<p>'+para.join('<br>')+'</p>');para=[]}}
  function closeList(){if(inList){html.push(listTag==='ul'?'</ul>':'</ol>');inList=false}}
  t.split('\n').forEach(function(line){
    let ls=line.trim();
    // 还原代码块 token
    if(/^@@C\d+@@$/.test(ls)){flushPara();closeList();html.push(tokens[+ls.replace(/@@C(\d+)@@/,'$1')]);return}
    if(!ls){flushPara();closeList();return}
    let hd=ls.match(/^(#{1,6})\s+(.*)/);
    if(hd){flushPara();closeList();html.push('<h'+hd[1].length+'>'+hd[2]+'</h'+hd[1].length+'>');return}
    let hr=/^(-{3,}|\*{3,}|_{3,})$/.test(ls);
    if(hr){flushPara();closeList();html.push('<hr>');return}
    let bq=ls.match(/^&gt;\s?(.*)/); // 转义后 '>' 变 '&gt;'
    if(bq){flushPara();closeList();html.push('<blockquote>'+bq[1]+'</blockquote>');return}
    let ul=ls.match(/^[-*+]\s+(.*)/);
    let ol=ls.match(/^\d+[.)]\s+(.*)/);
    if(ul||ol){
      flushPara();
      let tag=ul?'ul':'ol';
      if(!inList){inList=true;listTag=tag;html.push(tag==='ul'?'<ul>':'<ol>')}
      html.push('<li>'+(ul?ul[1]:ol[1])+'</li>');
      return;
    }
    if(inList)closeList();
    para.push(line);
  });
  flushPara();closeList();
  // 5) 还原行内残留 token（理论已全部处理，兜底）
  html=html.join('');
  html=html.replace(/@@C(\d+)@@/g,function(_,i){return tokens[+i]});
  return html;
}
function fmtGB(b){if(!b)return'-';return(b/1073741824).toFixed(1)+'G'}
function fmtUp(s){if(!s)return'-';let h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+'h'+m+'m'}
function scrollBtm(){chatArea.scrollTop=chatArea.scrollHeight}
function showToast(msg,type){
  let t=document.createElement('div');t.className='toast'+(type==='error'?' error':'');
  t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},3000);
}
