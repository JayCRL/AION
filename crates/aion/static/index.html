<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AION — Agent OS</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--txt:#e6edf3;--txt2:#8b949e;--acc:#58a6ff;--acc2:#1f6feb;--ok:#3fb950;--err:#f85149;--warn:#d29922;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;display:flex}
.sidebar{width:280px;min-width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sb-head{padding:16px;border-bottom:1px solid var(--border)}
.sb-logo{width:36px;height:36px;border-radius:8px}
.sb-title{font-size:16px;font-weight:700;margin-top:8px}
.sb-sub{font-size:11px;color:var(--txt2);margin-top:2px}
.sb-section{padding:12px 16px;border-bottom:1px solid var(--border)}
.sb-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--txt2);margin-bottom:8px}
.tool-item{padding:6px 8px;border-radius:6px;font-size:12px;cursor:default;display:flex;align-items:center;gap:6px}
.tool-item:hover{background:var(--bg3)}
.tool-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0}
.tool-name{font-family:monospace;color:var(--acc)}
.tool-risk{margin-left:auto;font-size:10px;color:var(--txt2)}
.svc-item{font-size:11px;padding:4px 8px;color:var(--txt2);font-family:monospace}
.svc-state{color:var(--ok);font-size:10px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.header h1{font-size:15px;font-weight:600}
.header .badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--bg3);color:var(--txt2)}
.msg-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg-area::-webkit-scrollbar{width:6px}
.msg-area::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
.msg{display:flex;gap:10px;max-width:800px}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.msg.user .avatar{background:var(--acc2);color:#fff}
.msg.assistant .avatar{background:var(--bg3);border:1px solid var(--border)}
.bubble{padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.6;word-break:break-word}
.msg.user .bubble{background:var(--acc2);color:#fff}
.msg.assistant .bubble{background:var(--bg2);border:1px solid var(--border);max-width:700px}
.bubble pre{background:var(--bg);padding:10px;border-radius:6px;overflow-x:auto;font-size:13px;margin:8px 0;border:1px solid var(--border)}
.bubble code{font-family:monospace;font-size:13px}
.bubble p{margin:4px 0}
.block-term{background:#0a0a0a;border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-family:monospace;font-size:13px;margin:8px 0;overflow-x:auto;white-space:pre-wrap;color:#c9d1d9}
.block-term .prompt{color:var(--ok)}
.block-term .out{color:#e6edf3}
.block-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center}
.stat-val{font-size:18px;font-weight:600;color:var(--acc)}
.stat-label{font-size:10px;color:var(--txt2);margin-top:2px}
.block-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.block-table th{background:var(--bg3);padding:6px 10px;text-align:left;border:1px solid var(--border)}
.block-table td{padding:6px 10px;border:1px solid var(--border)}
.block-confirm{background:var(--bg);border:1px solid var(--warn);border-radius:6px;padding:12px;margin:8px 0}
.block-confirm .cf-title{font-weight:600;color:var(--warn);margin-bottom:6px}
.block-confirm .cf-btns{display:flex;gap:8px;margin-top:10px}
.btn{padding:6px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:500}
.btn-primary{background:var(--acc2);color:#fff}
.btn-danger{background:var(--err);color:#fff}
.btn-ghost{background:var(--bg3);color:var(--txt2)}
.btn:hover{opacity:.85}
.action-bar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.action-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--acc);cursor:pointer;font-size:12px}
.action-btn:hover{background:var(--acc2);color:#fff}
.input-area{padding:16px 20px;border-top:1px solid var(--border)}
.input-wrap{display:flex;gap:8px;align-items:flex-end;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px}
.input-wrap:focus-within{border-color:var(--acc)}
textarea{flex:1;background:transparent;border:none;outline:none;color:var(--txt);font-size:14px;resize:none;font-family:inherit;line-height:1.5;max-height:150px}
.send-btn{background:var(--acc2);border:none;color:#fff;width:32px;height:32px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn:hover{opacity:.85}
.send-btn svg{width:16px;height:16px;fill:currentColor}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:10px 16px;border-radius:var(--radius);font-size:13px;z-index:100;animation:slideIn .3s}
.toast.error{border-color:var(--err);color:var(--err)}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.typing{display:flex;gap:4px;padding:10px}
.typing span{width:6px;height:6px;background:var(--txt2);border-radius:50%;animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sb-head">
    <img class="sb-logo" src="/logo.png" alt="AION">
    <div class="sb-title">AION</div>
    <div class="sb-sub">Agent OS Runtime</div>
  </div>
  <div class="sb-section">
    <div class="sb-label">Tools</div>
    <div id="toolList"><div class="svc-item">loading...</div></div>
  </div>
  <div class="sb-section">
    <div class="sb-label">Services</div>
    <div id="svcList"><div class="svc-item">loading...</div></div>
  </div>
</div>
<div class="main">
  <div class="header">
    <h1>AION Agent OS</h1>
    <span class="badge" id="platformBadge">...</span>
    <span class="badge" id="toolCount">...</span>
  </div>
  <div class="msg-area" id="msgArea">
    <div class="msg assistant"><div class="avatar">🤖</div><div class="bubble">你好！我是 AION Agent。输入消息或点击下方按钮与系统交互。</div></div>
  </div>
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="msgInput" rows="1" placeholder="输入消息... (Enter 发送)"></textarea>
      <button class="send-btn" onclick="send()"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
    </div>
  </div>
</div>
<script>
let $=function(s){return document.querySelector(s)};
let msgArea=$('#msgArea'),input=$('#msgInput');

async function init(){
  try{
    let responses=await Promise.all([
      fetch('/api/health').then(function(r){return r.json()}),
      fetch('/api/tools').then(function(r){return r.json()})
    ]);
    let health=responses[0],tools=responses[1];
    document.getElementById('platformBadge').textContent=health.platform||'unknown';
    document.getElementById('toolCount').textContent=(tools.count||0)+' tools';
    let tl=document.getElementById('toolList');tl.innerHTML='';
    (tools.tools||[]).forEach(function(t){
      let d=document.createElement('div');d.className='tool-item';
      d.innerHTML='<span class="tool-dot"></span><span class="tool-name">'+t.name+'</span><span class="tool-risk">'+t.risk+'</span>';
      tl.appendChild(d);
    });
    let sl=document.getElementById('svcList');sl.innerHTML='';
    (health.services||[]).forEach(function(s){
      let d=document.createElement('div');d.className='svc-item';
      d.innerHTML=s.name+' <span class="svc-state">'+s.state+'</span>';
      sl.appendChild(d);
    });
  }catch(e){console.error('init failed',e)}
}

function addUserMsg(text){
  let d=document.createElement('div');d.className='msg user';
  d.innerHTML='<div class="avatar">👤</div><div class="bubble">'+esc(text)+'</div>';
  msgArea.appendChild(d);scroll();
}

function addAssistantMsg(reply,blocks){
  let d=document.createElement('div');d.className='msg assistant';
  let avatar='<div class="avatar">🤖</div>';
  let bubble='<div class="bubble">'+md(reply)+'</div>';
  let blockHtml='';
  (blocks||[]).forEach(function(b){blockHtml+=renderBlock(b)});
  d.innerHTML=avatar+'<div>'+bubble+blockHtml+'</div>';
  msgArea.appendChild(d);scroll();
}

function renderBlock(b){
  if(!b||!b.type)return'';
  switch(b.type){
    case'text':return'<div class="bubble">'+md(b.markdown||'')+'</div>';
    case'terminal':
      let out=esc(b.output||'');
      return'<div class="block-term"><span class="prompt">$</span> '+esc(b.tool_call_id||'')+'<br><span class="out">'+out+'</span></div>';
    case'table':return renderTable(b);
    case'confirmation':return renderConfirm(b);
    default:return'<div class="bubble"><em>[block: '+b.type+']</em></div>';
  }
}

function renderStats(b){
  let stats=b.data||b;
  let html='<div class="block-stats">';
  if(stats.cpu)html+='<div class="stat-card"><div class="stat-val">CPU</div><div class="stat-label">user:'+(stats.cpu.user||0)+'</div></div>';
  if(stats.memory)html+='<div class="stat-card"><div class="stat-val">'+fmtGB(stats.memory.total_bytes)+'</div><div class="stat-label">Total Mem</div></div>';
  if(stats.load)html+='<div class="stat-card"><div class="stat-val">'+(stats.load.load1||'-')+'</div><div class="stat-label">Load 1m</div></div>';
  if(stats.uptime_seconds)html+='<div class="stat-card"><div class="stat-val">'+fmtUptime(stats.uptime_seconds)+'</div><div class="stat-label">Uptime</div></div>';
  html+='</div>';
  return html;
}

function renderTable(b){
  let headers=b.headers||[],rows=b.rows||[];
  let html='<table class="block-table"><tr>';
  headers.forEach(function(h){html+='<th>'+esc(h)+'</th>'});
  html+='</tr>';
  rows.forEach(function(r){html+='<tr>';r.forEach(function(c){html+='<td>'+esc(String(c))+'</td>'});html+='</tr>'});
  html+='</table>';
  return html;
}

function renderConfirm(b){
  let html='<div class="block-confirm"><div class="cf-title">'+esc(b.title||'确认')+'</div><div>'+esc(b.description||'')+'</div><div class="cf-btns">';
  (b.options||[]).forEach(function(o){
    html+='<button class="btn btn-'+(o.style||'ghost')+'" onclick="confirmAction(\''+b.request_id+'\',\''+o.choice+'\')">'+esc(o.label)+'</button>';
  });
  html+='</div></div>';
  return html;
}

async function confirmAction(requestId,choice){
  await sendRaw({message:'__confirm__',tool_call:{tool:"system.continue",arguments:{request_id:requestId,choice:choice}}});
}

async function invokeTool(tool,args){
  await sendRaw({message:'__tool__',tool_call:{tool:tool,arguments:args}});
}

async function send(){
  let text=input.value.trim();
  if(!text)return;
  input.value='';input.style.height='auto';
  addUserMsg(text);
  await sendRaw({message:text});
}

async function sendRaw(body){
  let typing=document.createElement('div');
  typing.className='msg assistant';
  typing.innerHTML='<div class="avatar">🤖</div><div class="typing"><span></span><span></span><span></span></div>';
  msgArea.appendChild(typing);scroll();
  try{
    let resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    let data=await resp.json();
    typing.remove();
    addAssistantMsg(data.reply_text||'',data.blocks);
    if(data.tool_calls&&data.tool_calls.length){
      let tcDiv=document.createElement('div');
      tcDiv.innerHTML=addActionBar(data.tool_calls.map(function(tc){return{tool:tc.tool,arguments:tc.arguments,label:tc.tool}}));
      msgArea.appendChild(tcDiv);
    }
  }catch(e){
    typing.remove();
    addAssistantMsg('Error: '+e.message);
  }
}

function addActionBar(actions){
  if(!actions||!actions.length)return'';
  let html='<div class="action-bar">';
  actions.forEach(function(a){
    html+='<button class="action-btn" onclick=\'invokeTool("'+a.tool+'",'+JSON.stringify(a.arguments||{})+')\'>'+esc(a.label||a.tool)+'</button>';
  });
  html+='</div>';
  return html;
}

function esc(s){let d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function md(s){
  return(s||'').replace(/```(\w*)\n([\s\S]*?)```/g,function(_,lang,code){return'<pre><code>'+esc(code)+'</code></pre>'})
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');
}
function fmtGB(bytes){if(!bytes)return'-';return(bytes/1073741824).toFixed(1)+'G'}
function fmtUptime(s){if(!s)return'-';let h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h+'h'+m+'m'}
function scroll(){msgArea.scrollTop=msgArea.scrollHeight}

input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,150)+'px'});

init();
</script>
</body>
</html>
