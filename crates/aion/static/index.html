<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AION OS</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
:root{--bg:#050508;--bg2:#0c0c14;--bg3:#12121e;--glass:rgba(255,255,255,.04);--glass-brd:rgba(255,255,255,.07);--txt:#eaeaf0;--txt2:#6b6b80;--acc:#7c6ee4;--acc-glow:rgba(124,110,228,.35);--ok:#34d399;--err:#f87171;--warn:#fbbf24;--r:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
::selection{background:var(--acc);color:#fff}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* ── ambient background ── */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars::before{content:'';position:absolute;inset:0;background:radial-gradient(1px 1px at 20% 30%,#fff4,transparent),radial-gradient(1px 1px at 80% 20%,#fff3,transparent),radial-gradient(1px 1px at 50% 70%,#fff2,transparent),radial-gradient(ellipse at 50% 100%,var(--acc-glow) 0%,transparent 60%);animation:starDrift 30s linear infinite}
@keyframes starDrift{0%{transform:translateY(0)}100%{transform:translateY(-20px)}}

/* ── logo ── */
.logo-wrap{position:fixed;z-index:10;display:flex;flex-direction:column;align-items:center;gap:16px;transition:all .8s cubic-bezier(.4,0,.2,1)}
.logo-img{filter:drop-shadow(0 0 40px var(--acc-glow));animation:logoFloat 5s ease-in-out infinite}
.logo-ring{position:absolute;top:-12px;left:-12px;right:-12px;bottom:-12px;border:1.5px solid transparent;border-top-color:var(--acc);border-radius:50%;animation:ringSpin 4s linear infinite;pointer-events:none}
.logo-ring::before{content:'';position:absolute;top:-4px;left:50%;width:5px;height:5px;background:var(--acc);border-radius:50%;box-shadow:0 0 12px var(--acc)}
.logo-text{font-size:28px;font-weight:700;letter-spacing:6px;background:linear-gradient(135deg,var(--acc),#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:0;animation:fadeIn 1s .5s forwards}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes ringSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes fadeIn{to{opacity:1}}

/* ── input ── */
.input-shell{position:fixed;z-index:10;transition:all .8s cubic-bezier(.4,0,.2,1)}
.input-box{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-brd);border-radius:24px;padding:14px 20px;transition:border-color .3s,box-shadow .3s}
.input-box:focus-within{border-color:var(--acc);box-shadow:0 0 30px var(--acc-glow)}
.input-box input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:16px;font-family:inherit}
.input-box input::placeholder{color:var(--txt2)}
.send-ico{width:36px;height:36px;border-radius:50%;background:var(--acc);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.send-ico:hover{transform:scale(1.1)}
.send-ico svg{width:16px;height:16px;fill:#fff}

/* ── landing state ── */
.state-landing .logo-wrap{top:32%;left:50%;transform:translate(-50%,-50%)}
.state-landing .logo-img{width:140px;height:140px}
.state-landing .input-shell{top:58%;left:50%;transform:translate(-50%,-50%);width:520px}
.state-landing #chatArea{opacity:0;pointer-events:none}
.state-landing .gear-btn{position:fixed;bottom:24px;left:24px;z-index:20}

/* ── chat state ── */
.state-chat .logo-wrap{top:16px;left:16px;transform:none;flex-direction:row;gap:10px}
.state-chat .logo-img{width:32px;height:32px;animation:none}
.state-chat .logo-ring{display:none}
.state-chat .logo-text{font-size:16px;letter-spacing:3px;margin-top:0;opacity:1;animation:none}
.state-chat .input-shell{bottom:20px;left:50%;transform:translateX(-50%);width:min(720px,90vw)}
.state-chat #chatArea{opacity:1;pointer-events:auto;transition:opacity .6s .3s}

/* ── chat area ── */
#chatArea{position:fixed;inset:0;top:60px;bottom:90px;left:0;right:0;z-index:5;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;pointer-events:none}
#chatArea>*{pointer-events:auto}
#chatArea::-webkit-scrollbar{width:3px}
#chatArea::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.msg{max-width:760px;width:100%;margin:0 auto}
.msg.user{align-self:flex-end}
.bubble{padding:12px 16px;border-radius:var(--r);font-size:14px;line-height:1.7;word-break:break-word}
.msg.user .bubble{background:rgba(124,110,228,.15);border:1px solid rgba(124,110,228,.2)}
.msg.assistant .bubble{background:var(--bg2);border:1px solid var(--glass-brd)}
.bubble pre{background:#0a0a0a;padding:10px;border-radius:8px;overflow-x:auto;font-size:13px;margin:8px 0;font-family:monospace}
.bubble code{font-family:monospace;font-size:13px}

/* ── blocks ── */
.blk-term{background:#050505;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 14px;font-family:monospace;font-size:13px;margin:8px 0;overflow-x:auto;white-space:pre-wrap;color:#c9d1d9}
.blk-term .pr{color:var(--ok)}
.blk-term .term-cmd{color:#8b949e;margin-bottom:4px}
.blk-term .term-out{white-space:pre-wrap;word-break:break-word;margin:0}
.blk-term .term-tag{margin-top:4px;font-size:11px;color:#8b949e}
.msg.typing-holder{padding:2px 6px}
.blk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}
.stat{background:var(--bg2);border:1px solid var(--glass-brd);border-radius:10px;padding:12px;text-align:center}
.stat-v{font-size:20px;font-weight:600;color:var(--acc)}
.stat-l{font-size:10px;color:var(--txt2);margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.blk-tbl{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.blk-tbl th{background:var(--bg3);padding:8px 10px;text-align:left;border-bottom:1px solid var(--glass-brd)}
.blk-tbl td{padding:8px 10px;border-bottom:1px solid var(--glass-brd)}
.blk-cfm{background:var(--bg2);border:1px solid var(--warn);border-radius:var(--r);padding:14px;margin:8px 0}
.blk-cfm .t{font-weight:600;color:var(--warn);margin-bottom:8px;font-size:14px}
.blk-cfm .btns{display:flex;gap:8px;margin-top:12px}
.btn{padding:7px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:opacity .2s}
.btn:hover{opacity:.8}
.btn-p{background:var(--acc);color:#fff}
.btn-d{background:var(--err);color:#fff}
.btn-g{background:var(--bg3);color:var(--txt2);border:1px solid var(--glass-brd)}

/* ── gear ── */
.gear-btn{position:fixed;bottom:24px;left:24px;z-index:20;width:36px;height:36px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-brd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .3s;backdrop-filter:blur(10px)}
.gear-btn:hover{border-color:var(--acc);transform:rotate(90deg)}

/* ── settings modal ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-ov.open{opacity:1;pointer-events:auto}
.modal{background:var(--bg2);border:1px solid var(--glass-brd);border-radius:16px;width:520px;max-width:92vw;max-height:85vh;overflow-y:auto;padding:24px;transform:scale(.95);transition:transform .3s}
.modal-ov.open .modal{transform:scale(1)}
.modal h2{font-size:16px;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.modal h2 .x{margin-left:auto;cursor:pointer;color:var(--txt2);font-size:20px;padding:0 4px}
.modal h2 .x:hover{color:var(--txt)}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--glass-brd);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;color:var(--txt2);border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.tab-content{display:none}
.tab-content.active{display:block}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;color:var(--txt2);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select{width:100%;background:var(--bg);border:1px solid var(--glass-brd);border-radius:8px;padding:8px 12px;color:var(--txt);font-size:13px;outline:none;transition:border-color .2s}
.fg input:focus,.fg select:focus{border-color:var(--acc)}
.save-btn{width:100%;padding:9px;background:var(--acc);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;margin-top:8px}
.save-btn:hover{opacity:.85}
.tool-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--glass-brd)}
.tool-row .n{font-family:monospace;font-size:13px;color:var(--acc)}
.tool-row .d{font-size:11px;color:var(--txt2);margin-top:2px}
.tool-row .risk{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:8px}
.risk-low{background:rgba(52,211,153,.15);color:var(--ok)}
.risk-medium{background:rgba(251,191,36,.15);color:var(--warn)}
.risk-high{background:rgba(248,113,113,.15);color:var(--err)}
.svc-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--glass-brd);font-size:13px}
.svc-row .n{font-family:monospace}
.svc-row .st{font-size:11px;color:var(--ok)}
.svc-row .st.pending{color:var(--txt2)}
/* ── provider manager (cc-switch style) ── */
.prov-row{border:1px solid var(--glass-brd);border-radius:10px;padding:12px 14px;margin-bottom:10px;transition:border-color .2s,background .2s}
.prov-row.active{border-color:var(--acc);background:rgba(124,110,228,.08)}
.prov-row .top{display:flex;align-items:center;gap:8px}
.prov-row .dot{width:8px;height:8px;border-radius:50%;background:var(--glass-brd);flex:none}
.prov-row.active .dot{background:var(--acc);box-shadow:0 0 8px var(--acc-glow)}
.prov-row .nm{font-size:14px;font-weight:600}
.prov-row .badge{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg3);color:var(--txt2);font-family:monospace}
.prov-row.active .badge{background:rgba(124,110,228,.2);color:var(--acc)}
.prov-row .meta{font-size:11px;color:var(--txt2);margin-top:5px;word-break:break-all}
.prov-row .ops{display:flex;gap:6px;margin-top:10px}
.mini-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--glass-brd);background:var(--bg3);color:var(--txt2);font-size:11px;cursor:pointer;transition:all .2s}
.mini-btn:hover{border-color:var(--acc);color:var(--txt)}
.mini-btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.mini-btn.danger:hover{border-color:var(--err);color:var(--err)}
.model-chip{position:fixed;bottom:26px;left:72px;z-index:20;font-size:11px;color:var(--txt2);display:flex;align-items:center;gap:6px}
.model-chip .live{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}

/* ── toast ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg3);border:1px solid var(--glass-brd);color:var(--txt);padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:200;animation:slideUp .3s}
.toast.error{border-color:var(--err);color:var(--err)}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.typing-dots{display:flex;gap:5px;padding:12px}
.typing-dots span{width:5px;height:5px;background:var(--txt2);border-radius:50%;animation:bnc 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes bnc{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
</style>
</head>
<body class="state-landing">
<div class="stars"></div>

<!-- logo -->
<div class="logo-wrap" id="logoWrap">
  <div style="position:relative;display:inline-block">
    <img class="logo-img" src="/logo.png" alt="AION" width="140" height="140">
    <div class="logo-ring"></div>
  </div>
  <div class="logo-text">AION</div>
</div>

<!-- input -->
<div class="input-shell" id="inputShell">
  <div class="input-box">
    <input id="msgInput" placeholder="输入你想做的事..." autocomplete="off">
    <button class="send-ico" onclick="send()"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
  </div>
</div>

<!-- chat area -->
<div id="chatArea"></div>

<!-- gear -->
<div class="gear-btn" onclick="openSettings()" title="Settings">⚙️</div>
<div class="model-chip" id="modelChip" style="display:none"><span class="live"></span><span id="modelName"></span></div>

<!-- settings modal -->
<div class="modal-ov" id="settingsModal">
  <div class="modal">
    <h2>⚙️ Settings <span class="x" onclick="closeSettings()">✕</span></h2>
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab('llm',this)">LLM</div>
      <div class="tab" onclick="switchTab('tools',this)">Tools</div>
      <div class="tab" onclick="switchTab('services',this)">Services</div>
    </div>
    <div class="tab-content active" id="tab-llm">
      <div id="provList"><p style="color:var(--txt2);font-size:13px">Loading...</p></div>
      <div id="provForm" style="display:none;margin-top:6px;border-top:1px solid var(--glass-brd);padding-top:14px">
        <div class="fg"><label>名称</label><input type="text" id="pName" placeholder="例：智谱 GLM / DeepSeek"></div>
        <div class="fg"><label>协议</label><select id="pProtocol">
          <option value="openai">OpenAI 兼容（{base}/chat/completions）</option>
          <option value="anthropic">Anthropic 兼容（{base}/v1/messages）</option>
        </select></div>
        <div class="fg"><label>预设填充</label><select id="pPreset" onchange="onPresetChange()">
          <option value="">— 选择预设 —</option>
          <option value="zhipu">智谱 GLM（Anthropic）</option>
          <option value="deepseek">DeepSeek</option>
          <option value="openai">OpenAI</option>
          <option value="qwen">Qwen (DashScope)</option>
        </select></div>
        <div class="fg"><label>Base URL</label><input type="text" id="pUrl" placeholder="https://api.deepseek.com/v1"></div>
        <div class="fg"><label>API Key</label><input type="password" id="pKey" placeholder="sk-...（编辑时留空 = 不修改）"></div>
        <div class="fg"><label>Model</label><input type="text" id="pModel" placeholder="deepseek-chat"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="save-btn" style="margin-top:0" onclick="saveProvider()">保存并启用</button>
          <button class="save-btn" style="margin-top:0;background:var(--bg3);color:var(--txt2)" onclick="hideProvForm()">取消</button>
        </div>
      </div>
      <button class="save-btn" id="addProvBtn" style="background:var(--bg3);color:var(--txt)" onclick="showProvForm()">＋ 添加供应商</button>
    </div>
    <div class="tab-content" id="tab-tools">
      <div id="toolsList">Loading...</div>
    </div>
    <div class="tab-content" id="tab-services">
      <div id="servicesList">Loading...</div>
    </div>
  </div>
</div>

<script>
let $=function(s){return document.querySelector(s)};
let chatArea=document.getElementById('chatArea');
let input=document.getElementById('msgInput');
let inChatMode=false;
let currentSession=null;
let streamBusy=false;
let openBubble=null, openAcc='';
let PROV_PRESETS={
  zhipu:{protocol:'anthropic',url:'https://open.bigmodel.cn/api/anthropic',model:'glm-5.3-flash'},
  deepseek:{protocol:'openai',url:'https://api.deepseek.com/v1',model:'deepseek-chat'},
  openai:{protocol:'openai',url:'https://api.openai.com/v1',model:'gpt-4o'},
  qwen:{protocol:'openai',url:'https://dashscope.aliyuncs.com/compatible-mode/v1',model:'qwen-turbo'}
};
let editProvId=null;

// init
async function init(){
  try{
    let[h,t]=await Promise.all([fetch('/api/health').then(r=>r.json()),fetch('/api/tools').then(r=>r.json())]);
    renderTools(t.tools||[]);
    renderServices(h.services||[]);
    updateModelChip(h.llm);
  }catch(e){console.error(e)}
  loadProviders();
  input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  input.focus();
}

// ── LLM provider manager（cc-switch 风格）──
async function loadProviders(){
  try{
    let d=await fetch('/api/llm/providers').then(function(r){return r.json()});
    renderProviders(d.providers||[],d.active);
  }catch(e){
    document.getElementById('provList').innerHTML='<p style="color:var(--err);font-size:13px">加载失败: '+esc(e.message)+'</p>';
  }
}

function renderProviders(providers,activeId){
  let el=document.getElementById('provList');
  if(!providers.length){
    el.innerHTML='<p style="color:var(--txt2);font-size:13px;margin-bottom:10px">尚未配置供应商，当前使用内置 Echo 后端。点击下方「添加供应商」接入真实 LLM。</p>';
    return;
  }
  el.innerHTML='';
  providers.forEach(function(p){
    let row=document.createElement('div');
    row.className='prov-row'+(p.active?' active':'');
    let meta=esc(p.model)+' · '+esc(p.base_url)+(p.has_key?'':' · <span style="color:var(--warn)">未设置 Key</span>');
    row.innerHTML='<div class="top"><span class="dot"></span><span class="nm">'+esc(p.name)+'</span><span class="badge">'+esc(p.protocol)+'</span></div>'
      +'<div class="meta">'+meta+'</div>'
      +'<div class="ops">'
      +(p.active?'':'<button class="mini-btn primary" onclick="activateProvider(\''+esc(p.id)+'\')">启用</button>')
      +'<button class="mini-btn" onclick="testProvider(\''+esc(p.id)+'\')">测试</button>'
      +'<button class="mini-btn" onclick="editProvider(\''+esc(p.id)+'\')">编辑</button>'
      +'<button class="mini-btn danger" onclick="deleteProvider(\''+esc(p.id)+'\')">删除</button>'
      +(p.active?'<span style="margin-left:auto;font-size:11px;color:var(--acc);align-self:center">✓ 当前使用</span>':'')
      +'</div>';
    el.appendChild(row);
  });
}

function updateModelChip(llm){
  let chip=document.getElementById('modelChip');
  if(llm&&llm.name){
    chip.style.display='flex';
    document.getElementById('modelName').textContent=llm.name+' · '+llm.model;
  }else{
    chip.style.display='none';
  }
}

function showProvForm(){
  editProvId=null;
  document.getElementById('provForm').style.display='block';
  document.getElementById('addProvBtn').style.display='none';
  ['pName','pUrl','pKey','pModel'].forEach(function(id){document.getElementById(id).value=''});
  document.getElementById('pProtocol').value='openai';
  document.getElementById('pPreset').value='';
  document.getElementById('pName').focus();
}
function hideProvForm(){
  document.getElementById('provForm').style.display='none';
  document.getElementById('addProvBtn').style.display='block';
  editProvId=null;
}
function onPresetChange(){
  let key=document.getElementById('pPreset').value;
  let p=PROV_PRESETS[key];
  if(!p)return;
  document.getElementById('pProtocol').value=p.protocol;
  document.getElementById('pUrl').value=p.url;
  document.getElementById('pModel').value=p.model;
}

async function saveProvider(){
  let body={
    name:document.getElementById('pName').value.trim(),
    protocol:document.getElementById('pProtocol').value,
    base_url:document.getElementById('pUrl').value.trim(),
    api_key:document.getElementById('pKey').value,
    model:document.getElementById('pModel').value.trim(),
    activate:true
  };
  if(editProvId)body.id=editProvId;
  if(!body.name){showToast('请填写供应商名称','error');return}
  if(!body.base_url||!body.model){showToast('Base URL 与 Model 不能为空','error');return}
  if(!editProvId&&!body.api_key){showToast('请填写 API Key','error');return}
  try{
    let r=await fetch('/api/llm/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    let d=await r.json();
    if(d.status==='ok'){
      showToast('✅ '+body.name+' 已启用');
      hideProvForm();
      await loadProviders();
      refreshHealth();
    }else{showToast('保存失败: '+(d.error||'未知错误'),'error')}
  }catch(e){showToast('保存失败: '+e.message,'error')}
}

function editProvider(id){
  let d=allProvidersCache.find(function(p){return p.id===id});
  if(!d)return;
  editProvId=id;
  document.getElementById('provForm').style.display='block';
  document.getElementById('addProvBtn').style.display='none';
  document.getElementById('pName').value=d.name;
  document.getElementById('pProtocol').value=d.protocol;
  document.getElementById('pUrl').value=d.base_url;
  document.getElementById('pKey').value='';
  document.getElementById('pKey').placeholder=d.has_key?'已设置（留空 = 不修改）':'sk-...';
  document.getElementById('pModel').value=d.model;
  document.getElementById('pPreset').value='';
}

async function activateProvider(id){
  try{
    let r=await fetch('/api/llm/providers/'+id+'/activate',{method:'POST'});
    let d=await r.json();
    if(d.status==='ok'){showToast('✅ 已切换');await loadProviders();refreshHealth()}
    else showToast('切换失败: '+(d.error||''),'error');
  }catch(e){showToast('切换失败: '+e.message,'error')}
}

async function deleteProvider(id){
  if(!confirm('确定删除该供应商配置？'))return;
  try{
    let r=await fetch('/api/llm/providers/'+id,{method:'DELETE'});
    let d=await r.json();
    if(d.status==='ok'){showToast('已删除');await loadProviders();refreshHealth()}
    else showToast('删除失败: '+(d.error||''),'error');
  }catch(e){showToast('删除失败: '+e.message,'error')}
}

async function testProvider(id){
  showToast('测试中...');
  try{
    let r=await fetch('/api/llm/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})});
    let d=await r.json();
    if(d.status==='ok')showToast('✅ 连通正常: '+String(d.reply).substring(0,40));
    else showToast('❌ '+(d.error||'测试失败').substring(0,120),'error');
  }catch(e){showToast('❌ '+e.message,'error')}
}

let allProvidersCache=[];
function cacheProviders(list){allProvidersCache=list}
let _origRender=renderProviders;
renderProviders=function(list,activeId){allProvidersCache=list;_origRender(list,activeId)};

async function refreshHealth(){
  try{
    let h=await fetch('/api/health').then(function(r){return r.json()});
    updateModelChip(h.llm);
    renderServices(h.services||[]);
  }catch(e){}
}

function renderTools(tools){
  let el=document.getElementById('toolsList');
  if(!tools.length){el.innerHTML='<p style="color:var(--txt2);font-size:13px">No tools registered</p>';return}
  el.innerHTML='';
  tools.forEach(function(t){
    let d=document.createElement('div');d.className='tool-row';
    d.innerHTML='<div><span class="n">'+t.name+'</span><span class="risk risk-'+t.risk+'">'+t.risk+'</span><div class="d">'+esc(t.description)+'</div></div>';
    el.appendChild(d);
  });
}

function renderServices(svcs){
  let el=document.getElementById('servicesList');
  if(!svcs.length){el.innerHTML='<p style="color:var(--txt2);font-size:13px">No services</p>';return}
  el.innerHTML='';
  svcs.forEach(function(s){
    let d=document.createElement('div');d.className='svc-row';
    d.innerHTML='<span class="n">'+s.name+'</span><span class="st '+s.state+'">'+s.state+'</span>';
    el.appendChild(d);
  });
}

// transition landing → chat
function enterChatMode(){
  if(inChatMode)return;
  inChatMode=true;
  document.body.classList.remove('state-landing');
  document.body.classList.add('state-chat');
  setTimeout(function(){input.focus()},800);
}

// send
async function send(){
  let text=input.value.trim();
  if(!text||streamBusy)return;
  input.value='';
  enterChatMode();
  addUserMsg(text);
  await sendRaw({message:text});
}

function addTyping(){
  let t=document.createElement('div');t.className='msg assistant typing-holder';
  t.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
  chatArea.appendChild(t);scrollBtm();
}
function removeTyping(){let t=chatArea.querySelector('.typing-holder');if(t)t.remove()}

// 走 SSE 流式端点；会话 ID 跨轮保持，服务端不可用时回退一次性 /api/chat
async function sendRaw(body){
  if(streamBusy)return;
  streamBusy=true;
  if(currentSession&&!body.session_id)body=Object.assign({},body,{session_id:currentSession});
  openBubble=null;openAcc='';
  addTyping();
  try{
    let resp=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!resp.ok||!resp.body)throw new Error('HTTP '+resp.status);
    await consumeSSE(resp);
  }catch(e){
    removeTyping();openBubble=null;openAcc='';
    try{
      let r2=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r2.ok)throw new Error('HTTP '+r2.status);
      let data=await r2.json();
      removeTyping();
      addAssistantMsg(data.reply_text||'',data.blocks||[]);
    }catch(e2){
      removeTyping();
      addAssistantMsg('⚠️ '+(e2.message||'error'));
    }
  }finally{streamBusy=false;removeTyping()}
}

async function consumeSSE(resp){
  const reader=resp.body.getReader();
  const dec=new TextDecoder();
  let buf='';
  for(;;){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let nl;
    while((nl=buf.indexOf('\n'))>=0){
      let line=buf.slice(0,nl);buf=buf.slice(nl+1);
      if(line.charAt(line.length-1)==='\r')line=line.slice(0,-1);
      if(line.slice(0,5)!=='data:')continue;
      let payload=line.slice(5);
      if(payload.charAt(0)===' ')payload=payload.slice(1);
      if(!payload)continue;
      let ev;try{ev=JSON.parse(payload)}catch(err){continue}
      onSSE(ev);
    }
  }
}

function onSSE(ev){
  switch(ev.type){
    case'start':
      if(ev.session_id)currentSession=ev.session_id;
      break;
    case'delta':
      removeTyping();
      if(!openBubble){openBubble=makeStreamBubble();openAcc=''}
      openAcc+=(ev.text||'');
      openBubble.querySelector('.bubble').innerHTML=md(openAcc);
      scrollBtm();
      break;
    case'seal':
      removeTyping();
      if(openBubble){
        if(ev.final!==undefined&&ev.final!==null&&ev.final!=='')
          openBubble.querySelector('.bubble').innerHTML=md(ev.final);
        openBubble=null;openAcc='';
      }
      break;
    case'tool':
      removeTyping();openBubble=null;openAcc='';
      appendChip('🔧 '+(ev.tool||'tool')+(ev.command?' → $ '+ev.command:''));
      break;
    case'terminal':
      removeTyping();openBubble=null;openAcc='';
      appendTerminal(ev);
      break;
    case'error':
      removeTyping();openBubble=null;openAcc='';
      addAssistantMsg('⚠️ '+(ev.message||'error'));
      break;
    case'done':
      removeTyping();openBubble=null;openAcc='';
      if(ev.session_id)currentSession=ev.session_id;
      break;
  }
}

function makeStreamBubble(){
  let d=document.createElement('div');d.className='msg assistant';
  d.innerHTML='<div class="bubble"></div>';
  chatArea.appendChild(d);scrollBtm();
  return d;
}
function appendChip(text){
  let d=document.createElement('div');d.className='msg assistant';
  d.innerHTML='<div class="bubble" style="font-family:monospace;font-size:12px;color:var(--txt2);padding:8px 14px">'+esc(text)+'</div>';
  chatArea.appendChild(d);scrollBtm();
}
function appendTerminal(b){
  let d=document.createElement('div');d.className='msg assistant';
  d.innerHTML=renderBlock({type:'terminal',command:b.command,output:b.output,stderr:b.stderr,code:b.code,timed_out:b.timed_out});
  chatArea.appendChild(d);scrollBtm();
}

function addUserMsg(text){
  let d=document.createElement('div');d.className='msg user';
  d.innerHTML='<div class="bubble">'+esc(text)+'</div>';
  chatArea.appendChild(d);scrollBtm();
}

// blocks 是唯一渲染源：每个 text 块 = 一个气泡，terminal 独立成块 —— 不再叠加 reply_text
function addAssistantMsg(reply,blocks){
  let bs=(blocks&&blocks.length)?blocks:(reply?[{type:'text',markdown:reply}]:[]);
  let html=bs.map(renderBlock).join('');
  if(!html)return;
  let d=document.createElement('div');d.className='msg assistant';
  d.innerHTML=html;
  chatArea.appendChild(d);scrollBtm();
}

function renderBlock(b){
  if(!b||!b.type)return'';
  switch(b.type){
    case'text':return'<div class="bubble">'+md(b.markdown||'')+'</div>';
    case'terminal':{
      let h='<div class="blk-term">';
      if(b.command)h+='<div class="term-cmd"><span class="pr">$</span> '+esc(b.command)+'</div>';
      let hasOut=b.output&&b.output.trim();
      let hasErr=b.stderr&&b.stderr.trim();
      if(hasOut)h+='<pre class="term-out">'+esc(b.output)+'</pre>';
      if(hasErr)h+='<pre class="term-out" style="color:#f85149">'+esc(b.stderr)+'</pre>';
      if(!hasOut&&!hasErr)h+='<pre class="term-out">(无输出)</pre>';
      let tag='';
      if(b.timed_out)tag='⏱ 执行超时';
      else if(b.code===0||b.code===null||b.code===undefined)tag='✓ exit 0';
      else if(b.code===-1)tag='';
      else tag='exit '+b.code;
      if(tag)h+='<div class="term-tag">'+tag+'</div>';
      return h+'</div>';
    }
    case'table':return renderTable(b);
    case'confirmation':return renderConfirm(b);
    default:return'';
  }
}

function renderStats(b){
  let s=b.data||b,html='<div class="blk-stats">';
  if(s.cpu)html+='<div class="stat"><div class="stat-v">CPU</div><div class="stat-l">'+(s.cpu.user||0)+' ticks</div></div>';
  if(s.memory)html+='<div class="stat"><div class="stat-v">'+fmtGB(s.memory.total_bytes)+'</div><div class="stat-l">Memory</div></div>';
  if(s.load)html+='<div class="stat"><div class="stat-v">'+(s.load.load1||'-')+'</div><div class="stat-l">Load 1m</div></div>';
  if(s.uptime_seconds)html+='<div class="stat"><div class="stat-v">'+fmtUp(s.uptime_seconds)+'</div><div class="stat-l">Uptime</div></div>';
  return html+'</div>';
}

function renderTable(b){
  let h=b.headers||[],r=b.rows||[];
  let html='<table class="blk-tbl"><tr>';
  h.forEach(function(x){html+='<th>'+esc(x)+'</th>'});
  html+='</tr>';
  r.forEach(function(row){html+='<tr>';row.forEach(function(c){html+='<td>'+esc(String(c))+'</td>'});html+='</tr>'});
  return html+'</table>';
}

function renderConfirm(b){
  let html='<div class="blk-cfm"><div class="t">⚠️ '+esc(b.title||'Confirm')+'</div><div style="font-size:13px;color:var(--txt2)">'+esc(b.description||'')+'</div><div class="btns">';
  (b.options||[]).forEach(function(o){
    html+='<button class="btn btn-'+(o.style||'g')+'" onclick="confirmAction(\''+b.request_id+'\',\''+o.choice+'\')">'+esc(o.label)+'</button>';
  });
  return html+'</div></div>';
}

async function confirmAction(rid,choice){
  await sendRaw({message:'__confirm__',tool_call:{tool:'system.continue',arguments:{request_id:rid,choice:choice}}});
}

// settings
function openSettings(){
  document.getElementById('settingsModal').classList.add('open');
  refreshToolsAndServices();
  loadProviders();
}
function closeSettings(){document.getElementById('settingsModal').classList.remove('open')}
function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(function(t){t.classList.remove('active')});
  document.getElementById('tab-'+name).classList.add('active');
}

async function refreshToolsAndServices(){
  try{
    let[h,t]=await Promise.all([fetch('/api/health').then(function(r){return r.json()}),fetch('/api/tools').then(function(r){return r.json()})]);
    renderTools(t.tools||[]);renderServices(h.services||[]);
  }catch(e){}
}

// utils
function esc(s){let d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function md(s){
  return(s||'').replace(/```(\w*)\n([\s\S]*?)```/g,function(_,l,c){return'<pre><code>'+esc(c)+'</code></pre>'})
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');
}
function fmtGB(b){if(!b)return'-';return(b/1073741824).toFixed(1)+'G'}
function fmtUp(s){if(!s)return'-';let h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+'h'+m+'m'}
function scrollBtm(){chatArea.scrollTop=chatArea.scrollHeight}
function showToast(msg,type){
  let t=document.createElement('div');t.className='toast'+(type==='error'?' error':'');
  t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},3000);
}

init();
