<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION - Agent OS Runtime</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a2e;
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --border: rgba(255, 255, 255, 0.1);
            --success: #00ff88;
            --error: #ff4444;
        }
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden;
        }
        .bg-animation::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 0.8; } }
        .grid-lines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 50px); } }
        .app-container { position: relative; z-index: 1; display: flex; height: 100vh; }
        .sidebar {
            width: 320px; background: var(--bg-secondary); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; backdrop-filter: blur(20px);
        }
        .logo-section { padding: 30px 20px; text-align: center; border-bottom: 1px solid var(--border); }
        .logo-container { position: relative; display: inline-block; }
        .logo-container img {
            width: 120px; height: 120px; object-fit: contain;
            filter: drop-shadow(0 0 30px var(--accent-glow)); animation: logoFloat 6s ease-in-out infinite;
        }
        @keyframes logoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .logo-ring {
            position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 2px solid transparent; border-top-color: var(--accent); border-radius: 50%;
            animation: ringRotate 3s linear infinite;
        }
        @keyframes ringRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .logo-title {
            margin-top: 15px; font-size: 28px; font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #00ff88);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 4px;
        }
        .logo-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 5px; letter-spacing: 2px; }
        .settings-panel { flex: 1; padding: 20px; overflow-y: auto; }
        .settings-panel::-webkit-scrollbar { width: 6px; }
        .settings-panel::-webkit-scrollbar-track { background: transparent; }
        .settings-panel::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
        .section-title {
            font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px;
            color: var(--accent); margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
        }
        .section-title::before { content: ''; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 16px; background: var(--bg-tertiary); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-primary); font-size: 14px; transition: all 0.3s ease; outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
        .form-group input::placeholder { color: #555; }
        .btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), #0099cc);
            border: none; border-radius: 8px; color: var(--bg-primary); font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 2px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px var(--accent-glow); }
        .btn:active { transform: translateY(0); }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .btn-outline:hover { background: var(--accent); color: var(--bg-primary); }
        .status-indicator {
            display: flex; align-items: center; gap: 8px; padding: 12px 16px;
            background: var(--bg-tertiary); border-radius: 8px; margin-top: 15px; font-size: 12px;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: statusPulse 2s ease-in-out infinite; }
        .status-dot.offline { background: var(--error); }
        @keyframes statusPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .chat-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); }
        .chat-header {
            padding: 20px 30px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .chat-header-title { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .chat-header-title::before { content: '💬'; font-size: 24px; }
        .model-badge {
            padding: 4px 12px; background: var(--bg-tertiary); border: 1px solid var(--accent);
            border-radius: 20px; font-size: 11px; color: var(--accent); font-weight: 500;
        }
        .messages-container { flex: 1; overflow-y: auto; padding: 30px; }
        .messages-container::-webkit-scrollbar { width: 6px; }
        .messages-container::-webkit-scrollbar-track { background: transparent; }
        .messages-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .message { display: flex; gap: 15px; margin-bottom: 25px; animation: messageIn 0.4s ease-out; }
        @keyframes messageIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { flex-direction: row-reverse; }
        .message-avatar {
            width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-size: 20px; flex-shrink: 0;
        }
        .message.user .message-avatar { background: linear-gradient(135deg, #667eea, #764ba2); }
        .message.assistant .message-avatar { background: linear-gradient(135deg, var(--accent), #00ff88); }
        .message-content {
            max-width: 70%; padding: 16px 20px; border-radius: 16px; font-size: 14px; line-height: 1.6;
        }
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea, #764ba2); border-bottom-right-radius: 4px;
        }
        .message.assistant .message-content {
            background: var(--bg-secondary); border: 1px solid var(--border); border-bottom-left-radius: 4px;
        }
        .message-content pre {
            background: var(--bg-tertiary); padding: 12px; border-radius: 8px; overflow-x: auto;
            margin: 10px 0; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px;
        }
        .message-content code {
            background: var(--bg-tertiary); padding: 2px 6px; border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px;
        }
        .typing-indicator { display: none; padding: 16px 20px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; border-bottom-left-radius: 4px; width: fit-content; }
        .typing-indicator.active { display: block; }
        .typing-dots { display: flex; gap: 4px; }
        .typing-dots span { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: typingBounce 1.4s ease-in-out infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .input-container { padding: 20px 30px; background: var(--bg-secondary); border-top: 1px solid var(--border); }
        .input-wrapper { display: flex; gap: 12px; align-items: flex-end; }
        .input-field {
            flex: 1; padding: 16px 20px; background: var(--bg-tertiary); border: 1px solid var(--border);
            border-radius: 12px; color: var(--text-primary); font-size: 14px; resize: none; outline: none;
            transition: all 0.3s ease; min-height: 52px; max-height: 200px; font-family: inherit;
        }
        .input-field:focus { border-color: var(--accent); box-shadow: 0 0 30px var(--accent-glow); }
        .send-btn {
            width: 52px; height: 52px; background: linear-gradient(135deg, var(--accent), #0099cc);
            border: none; border-radius: 12px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; transition: all 0.3s ease; flex-shrink: 0;
        }
        .send-btn:hover { transform: scale(1.05); box-shadow: 0 10px 30px var(--accent-glow); }
        .send-btn svg { width: 24px; height: 24px; fill: var(--bg-primary); }
        .welcome-screen {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; text-align: center;
        }
        .welcome-logo {
            width: 150px; height: 150px; object-fit: contain; filter: drop-shadow(0 0 50px var(--accent-glow));
            margin-bottom: 30px; animation: logoFloat 6s ease-in-out infinite;
        }
        .welcome-title {
            font-size: 36px; font-weight: 700; background: linear-gradient(135deg, var(--accent), #00ff88);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;
        }
        .welcome-subtitle { font-size: 16px; color: var(--text-secondary); margin-bottom: 40px; }
        .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 600px; }
        .quick-action {
            padding: 20px; background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 12px; cursor: pointer; transition: all 0.3s ease; text-align: left;
        }
        .quick-action:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
        .quick-action-icon { font-size: 28px; margin-bottom: 10px; }
        .quick-action-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
        .quick-action-desc { font-size: 12px; color: var(--text-secondary); }
        .toast {
            position: fixed; top: 20px; right: 20px; padding: 16px 24px; background: var(--bg-secondary);
            border: 1px solid var(--accent); border-radius: 12px; color: var(--text-primary); font-size: 14px;
            z-index: 1000; animation: toastIn 0.3s ease-out; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .toast.error { border-color: var(--error); }
        @keyframes toastIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @media (max-width: 768px) { .sidebar { display: none; } .quick-actions { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="bg-animation"><div class="grid-lines"></div></div>
    <div class="app-container">
        <div class="sidebar">
            <div class="logo-section">
                <div class="logo-container">
                    <div class="logo-ring"></div>
                    <img src="/logo.png" alt="AION Logo">
                </div>
                <div class="logo-title">AION</div>
                <div class="logo-subtitle">AGENT OS RUNTIME</div>
            </div>
            <div class="settings-panel">
                <div class="section-title">模型配置</div>
                <div class="form-group">
                    <label>API Provider</label>
                    <select id="provider">
                        <option value="openai">OpenAI</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="qwen">通义千问</option>
                        <option value="custom">自定义</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" id="apiKey" placeholder="sk-xxxxxxxxxx">
                </div>
                <div class="form-group">
                    <label>API URL</label>
                    <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1">
                </div>
                <div class="form-group">
                    <label>模型名称</label>
                    <input type="text" id="modelName" placeholder="gpt-3.5-turbo">
                </div>
                <button class="btn" onclick="saveConfig()">保存配置</button>
                <div class="section-title" style="margin-top: 30px;">系统状态</div>
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">未配置</span>
                </div>
                <button class="btn btn-outline" style="margin-top: 15px;" onclick="testConnection()">测试连接</button>
            </div>
        </div>
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-header-title">AION Assistant</div>
                <div class="model-badge" id="modelBadge">未配置</div>
            </div>
            <div id="chatArea">
                <div class="welcome-screen" id="welcomeScreen">
                    <img src="/logo.png" alt="AION" class="welcome-logo">
                    <div class="welcome-title">欢迎使用 AION</div>
                    <div class="welcome-subtitle">Agent Operating Infrastructure & Nations</div>
                    <div class="quick-actions">
                        <div class="quick-action" onclick="sendQuickAction('介绍一下 AION 项目')">
                            <div class="quick-action-icon">🚀</div>
                            <div class="quick-action-title">了解 AION</div>
                            <div class="quick-action-desc">探索 Agent OS 架构</div>
                        </div>
                        <div class="quick-action" onclick="sendQuickAction('写一个 Hello World 程序')">
                            <div class="quick-action-icon">💻</div>
                            <div class="quick-action-title">编写代码</div>
                            <div class="quick-action-desc">让 AI 帮你编程</div>
                        </div>
                        <div class="quick-action" onclick="sendQuickAction('解释一下 Linux namespace')">
                            <div class="quick-action-icon">📚</div>
                            <div class="quick-action-title">学习知识</div>
                            <div class="quick-action-desc">获取技术解答</div>
                        </div>
                    </div>
                </div>
                <div class="messages-container" id="messagesContainer" style="display: none;">
                    <div id="messages"></div>
                    <div class="typing-indicator" id="typingIndicator">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                    </div>
                </div>
            </div>
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea class="input-field" id="messageInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
                    <button class="send-btn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const PRESETS = {
            openai: { url: 'https://api.openai.com/v1', model: 'gpt-3.5-turbo' },
            deepseek: { url: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
            qwen: { url: 'https://dashscope.aliyuncs.com/compatible-mode/v1', model: 'qwen-turbo' },
            custom: { url: '', model: '' }
        };
        let config = JSON.parse(localStorage.getItem('aion-config') || '{}');
        let messages = [];
        let isLoading = false;

        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            const input = document.getElementById('messageInput');
            input.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 200) + 'px'; });
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
            document.getElementById('provider').addEventListener('change', (e) => {
                const p = PRESETS[e.target.value];
                if (p.url) document.getElementById('apiUrl').value = p.url;
                if (p.model) document.getElementById('modelName').value = p.model;
            });
        });

        function loadConfig() {
            document.getElementById('provider').value = config.provider || 'openai';
            document.getElementById('apiKey').value = config.apiKey || '';
            document.getElementById('apiUrl').value = config.apiUrl || PRESETS.openai.url;
            document.getElementById('modelName').value = config.model || PRESETS.openai.model;
            updateStatus();
        }

        function saveConfig() {
            config.provider = document.getElementById('provider').value;
            config.apiKey = document.getElementById('apiKey').value;
            config.apiUrl = document.getElementById('apiUrl').value;
            config.model = document.getElementById('modelName').value;
            localStorage.setItem('aion-config', JSON.stringify(config));
            updateStatus();
            showToast('配置已保存');
        }

        function updateStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const badge = document.getElementById('modelBadge');
            if (config.apiKey) {
                dot.classList.remove('offline');
                text.textContent = '已配置';
                badge.textContent = config.model || '未配置';
            } else {
                dot.classList.add('offline');
                text.textContent = '未配置';
                badge.textContent = '未配置';
            }
        }

        async function testConnection() {
            if (!config.apiKey) { showToast('请先配置 API Key', 'error'); return; }
            showToast('正在测试...');
            try {
                const resp = await callOpenAI([{ role: 'user', content: 'Hello' }]);
                showToast('连接成功: ' + resp.substring(0, 50));
            } catch (e) {
                showToast('连接失败: ' + e.message, 'error');
            }
        }

        async function callOpenAI(msgs) {
            const url = (config.apiUrl || 'https://api.openai.com/v1') + '/chat/completions';
            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + config.apiKey },
                body: JSON.stringify({ model: config.model || 'gpt-3.5-turbo', messages: msgs, temperature: 0.7 })
            });
            if (!resp.ok) { const err = await resp.text(); throw new Error(err); }
            const data = await resp.json();
            return data.choices[0].message.content;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || isLoading) return;
            if (!config.apiKey) { showToast('请先配置 API Key', 'error'); return; }

            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('messagesContainer').style.display = 'block';
            addMessage('user', text);
            messages.push({ role: 'user', content: text });
            input.value = ''; input.style.height = 'auto';
            isLoading = true;
            document.getElementById('typingIndicator').classList.add('active');
            scrollToBottom();

            try {
                const reply = await callOpenAI(messages);
                addMessage('assistant', reply);
                messages.push({ role: 'assistant', content: reply });
            } catch (e) {
                addMessage('assistant', '❌ 错误: ' + e.message);
            }
            isLoading = false;
            document.getElementById('typingIndicator').classList.remove('active');
            scrollToBottom();
        }

        function sendQuickAction(text) { document.getElementById('messageInput').value = text; sendMessage(); }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            const avatar = role === 'user' ? '👤' : '🤖';
            let html = content.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            div.innerHTML = '<div class="message-avatar">' + avatar + '</div><div class="message-content">' + html + '</div>';
            document.getElementById('messages').appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() { const c = document.getElementById('messagesContainer'); c.scrollTop = c.scrollHeight; }

        function showToast(msg, type) {
            const t = document.createElement('div');
            t.className = 'toast' + (type === 'error' ? ' error' : '');
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
    </script>
</body>
</html>
