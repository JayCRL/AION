name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 20
  CARGO_NET_TIMEOUT: 120

jobs:
  build-test:
    name: ${{ matrix.os }} · build & test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      # `--test-threads=1`：并行测试用例各自的运行时同时 `tokio::process` spawn
      # 子进程时存在 SIGCHLD 回收竞争（Runtime A 的回收器可能错过通知 Runtime B 的
      # 子进程 exit）。生产环境 AION 运行单运行时不受影响；测试套件串行化即可让 CI
      # 确定性绿色。真内核 root 下完整沙箱路径的已手动验证（见 README）。
      - name: Test
        run: cargo test --workspace -- --test-threads=1
