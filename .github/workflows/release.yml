name: Release

# 打 v* tag 时出预编译 release 包（开箱即用 · 工作流 C）：
# 每个 Linux arch 一个自包含 tar.gz —— aion 二进制（前端已 include_str 内嵌，
# 脱离源码树可跑）+ aion.json 模板 + install.sh + aion.service + README.install.md。
# 另单独上传 install.sh，支持 `curl -sL …/install.sh | bash` 一行装。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: package (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: aion-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            asset: aion-aarch64-linux
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p aion --target ${{ matrix.target }}

      - name: Stage tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          D="dist/pkg"
          rm -rf "$D" && mkdir -p "$D"
          cp "target/${{ matrix.target }}/release/aion" "$D/aion"
          cp aion.example.json "$D/aion.json"
          cp scripts/install.sh "$D/install.sh"
          cp scripts/aion.service "$D/aion.service"
          cp README.install.md "$D/README.install.md"
          chmod +x "$D/aion" "$D/install.sh"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" \
            -C "$D" aion aion.json install.sh aion.service README.install.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            scripts/install.sh
