[workspace]
resolver = "2"
members = [
    "crates/cordis",
    "crates/aion-adapter",
    "crates/aion-services",
    "crates/aion-protocol",
    "crates/aion",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/JayCRL/AION"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "net", "fs"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

cordis = { path = "crates/cordis", version = "0.1.0" }
aion-adapter = { path = "crates/aion-adapter", version = "0.1.0" }
aion-services = { path = "crates/aion-services", version = "0.1.0" }
aion-protocol = { path = "crates/aion-protocol", version = "0.1.0" }

[profile.release]
lto = "thin"
